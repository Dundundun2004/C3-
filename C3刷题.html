        "技术案例": [ {"id": "js_al_1", "title": "1. [案例背景] 某建筑工地进行主体施工，搭设脚手架外侧未挂设密目式安全网，当日风很大，张某从楼底下经过，突然从五楼楼板边缘处掉下一块1米长4㎝×6㎝的方木，正好击中张某头部（未戴安全帽），经医院抢救无效死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_1_1", "title": "1.主要是风太大风吹落方木所致。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_1_2", "title": "2.脚手架外侧未按规定挂设密目式安全网。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_1_3", "title": "3.张某违章未戴安全帽。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_1_4", "title": "4.违反高处作业中物料均应堆放平稳的规定。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_2", "title": "2. [案例背景] 20XX年1月29日19：50分左右，某建筑施工单位一职工在浇筑人防地下车库汽车坡道外墙时，从5米左右高处坠落至基坑，经送某区医院抢救无效死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_2_1", "title": "1.该职工在浇筑外侧墙体时可以不用搭设作业平台和护栏。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_2_2", "title": "2.施工管理人员安全意识不足、安全措施不到位、冒险施工。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_2_3", "title": "3.该职工在高空作业时可以不使用安全带。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_2_4", "title": "4.该职工高空作业时应该佩戴安全帽。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_3", "title": "3. [案例背景] 某年2月20日上午，某厂安装主厂房屋面板，5名工作班成员在高处作业均未系安全带，在推动钢板过程中，因两侧用力不均，其中一侧3人坠落死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_3_1", "title": "1.工作班成员临边作业，按照要求安装了安全绳但没有系安全带。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_3_2", "title": "2.现场管理人员对工人作业点的安全检查不仔细，没有检查高处作业的安全保障措施是否到位。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_3_3", "title": "3.高处作业施工前，应对作业人员进行安全技术交底，并应记录。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_3_4", "title": "4.高处作业人员应根据作业的实际情况配备相应的高处作业安全防护用品。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_4", "title": "4. [案例背景] 某年6月12日上午，某厂2名工作人员周某和王某站在空气预热器上部钢结构上，在进行起重挂钩作业时，失去平衡同时跌落，周某安全带挂在安全绳上，坠落后被悬挂在半空；王某未将安全带挂在安全绳上，从标高24m坠落至5m的吹灰管道上，抢救无效死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_4_1", "title": "1.王某高处作业未将安全带挂在安全绳上，导致高空作业坠落死亡。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_4_2", "title": "2.施工单位购置的安全防护用具和安全防护服装必须符合行业标准或者企业标准。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_4_3", "title": "3.攀登和悬空高处作业人员以及搭设高处作业安全设施的人员，必须经过专业技术培训及专业考试合格，持证上岗，并定期进行体格检查。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_4_4", "title": "4.高处作业施工前，应对作业人员进行口头安全技术交底不用留存记录。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_5", "title": "5. [案例背景] 10月02日早上09:55，惠州市某清洗公司施工队伍在进行网架除尘清理施工时，施工负责人肖某爬至天网架，安全帽未系下颌带同时未系安全带在高处行走，由网架坠落至4米高的基准面，导致头部重伤和腰部多处骨折。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_5_1", "title": "1.施工负责人安全帽没有系下颌带，未正确佩戴。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_5_2", "title": "2.悬空作业的立足处的设置应牢固，并应配置登高和防坠落装置和设施。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_5_3", "title": "3.攀登和悬空高处作业人员以及搭设高处作业安全设施的人员，经过项目培训并考试合格即可上岗作业。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_5_4", "title": "4.严禁在未固定、无防护设施的构件及管道上进行作业或通行。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_6", "title": "6. [案例背景] 某建筑公司在月度安全检查中，发现3号工地脚手架搭设存在以下问题：1.超过24m高的脚手架没有搭设方案，无审批手续；2.采用的分段整体提升脚手架未经审查批准；3.部分使用的脚手架材料规格不一；4.搭设架子的基础多处出现不平整，立杆有悬空现象。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_6_1", "title": "1.依据《建设工程安全生产管理条例》规定，对达到一定规模的危险性较大的（   ）等分部分项工程应编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施。", "options": ["A.混凝土工程", "B.抹灰工程", "C.钢筋绑扎工程", "D.脚手架工程"], "correctIndex": 3}, {"subId": "js_al_6_2", "title": "2.根据建办质[2019]31号《危险性较大的分部分项工程安全管理规定》有关问题的通知，下列需要进行专家论证的分部分项工程是（   ）。", "options": ["A.基坑开挖深度超过3m。", "B.模板支撑高度超过5m。", "C.落地式脚手架搭设高度超过50m。", "D.爬升高度超过50m的附着式升降脚手架"], "correctIndex": 2}, {"subId": "js_al_6_3", "title": "3.为避免施工中引发脚手架坍塌事故，该工地脚手架应立即停止使用。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_6_4", "title": "4.上述安全检查中“超过24m高的脚手架没有搭设方案，无审批手续”，属于内业资料隐患问题，不影响架体的正常施工和使用，不属于违规行为。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_7", "title": "7. [案例背景] 某建筑公司在承建一栋宿舍楼时，因脚手架设计存在缺陷，违反有关安全规定，导致一名施工人员在施工时脚手架断裂，从脚手架上掉下来，因抢救无效导致死亡。\n　　事故经过：8月28日，由某建筑公司承建的宿舍楼主体己封顶，当天上午瓦工于某某等3人站在宿舍楼3单元6楼两阳台中间搭设的毛竹脚手架上浇筑阳台混凝土，由于没有专门搭设卸料平台，吊运的混凝土只好卸在该脚手架上临时铺设的钢模板上。8时49分左右，当第三料斗混凝土卸在钢模上，瓦工于某某上前清理料斗时，脚手架右侧内立杆突然断裂，钢模板滑落，于某某随钢模板坠落到地面，脑部和内脏严重受伤，施工现场管理人员急忙将他送往医院，但经抢救无效死亡。这起事故造成直接经济损失95万元。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_7_1", "title": "1.卸料平台没有经过计算，不符合搭设要求，直接用装修架取代卸料平台是造成本次事故的直接原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_7_2", "title": "2.下列属于导致事故发生的间接原因不包括（   ）", "options": ["A.用装修架取代卸料平台。", "B.施工荷载远超过脚手架的荷载承受能力。", "C.脚手架搭设完成后验收手续不严格。", "D.施工现场安全检查不到位，未能及时发现事故隐患。"], "correctIndex": 0}, {"subId": "js_al_7_3", "title": "3.为避免此类事故再次发生，应采取的防范措施不包括（   ）。", "options": ["A.卸料平台不能用毛竹架代替，必须经过设计计算，按设计计算搭设", "B.卸料平台应设置限定负荷标牌；脚手架必须执行搭设规范。", "C.加强对施工现场管理者的安全技术操作规程的教育，克服麻痹大意，加强责任心，杜绝违章作业。", "D.夜间不施工。"], "correctIndex": 3}, {"subId": "js_al_7_4", "title": "4.建筑公司认为卸料平台不需要编制专项施工方案，这种说法是否正确（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_8", "title": "8. [案例背景] 一高层住宅工程，正在装修，外脚手架已经拆到了五层楼板处，三个班组做了分工，一组贴面砖，二组负责剪断脚手架的连墙件，三组拆除脚手架，当五层面砖刚贴完一半时，二组已经将脚手架的连墙件全部拆除，当一组拟转移到下层作业时，脚手架向外倒塌，架上人员全部坠落。分析事故原因(1)连墙件应随施工进度逐层拆除。如不拆除，影响贴面砖的进度。(2)一组作业进度太慢，二组作业进度过快。(3)现场无人协调各组的进度。(4)没有对施工人员进行安全及交底。请判断：", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_8_1", "title": "1.拆除脚手架前，没有编制拆除方案，只在现场临时作了分工。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_8_2", "title": "2.脚手架的倒塌是由于第三组没有及时将架体拆除。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_8_3", "title": "3.现场管理混乱，缺少监督，不能及时发现隐患。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_8_4", "title": "4.连墙件应随施工进度逐层拆除。经过项目经理同意后，方可全部拆除。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_9", "title": "9. [案例背景] 某住宅建筑采用双排钢管脚手架施工，当施工进入外装修阶段；正值连阴雨季节，由于脚手架地基回填土处理不好，无排水设施，立杆直接立在地面上，夜里地基下沉，造成大面积脚手架倒塌，幸好无人施工，没有造成人员伤亡。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_9_1", "title": "1.脚手架基础没按规定进行加固、夯实、承载力未满足要求。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_9_2", "title": "2.脚手架验收不到位。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_9_3", "title": "3.脚手架底部无排水措施，违反了脚手架底面标高应高于自然地坪50mm的规定。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_9_4", "title": "4.脚手架搭设未经主管部门审批。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_10", "title": "10. [案例背景] 某工地，早晨上班，土建队的木工班继续拆除热电厂蒸发站工程7m高的混凝土平台模板，当一名工人从4-5轴线中间的钢窗进入操作地点时，他左手攀着钢窗开窗器立管跃人室内，突然喊了两声“电着我了”。该班长立即跑去找电工切断电源线，但因电源来自安装队使用的卷扬机上的电源线，土建队电工不清楚，至到7、8分钟后，才切断电源，触电工人经抢救无效死亡。经查拆除的模板钢支架由4.8m处落下，一端砸断了卷扬机的电源线，另一端倒在拆下的钢管上，钢管又搭在钢窗上。  请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_10_1", "title": "1.事故的直接原因是卷扬机电源线被轧断后，又与钢管和钢窗相连，使钢窗带电，工人手扶钢窗触电死亡。   （   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_10_2", "title": "2.在拆除方案中，对拆下的钢管和钢支架等如何从高处放下，没有提出具体措施，才造成模板支架从4.8m落下，轧断了电源线。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_10_3", "title": "3.卷扬机与开关箱之间的距离没有超过规定的3m。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_10_4", "title": "4.该班长应该自己切断电源，无需找电工切断电源线。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_11", "title": "11. [案例背景] 某施工现场，一工人徒手推一运砖小铁车辗过一段地面上的电焊机电源线(电缆)，一声爆裂，该工人倒地身亡。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_11_1", "title": "1.小车将电缆线辗断，电缆破皮漏电二人手扶小铁车触电死亡。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_11_2", "title": "2.电焊机的开关箱中无漏电保护器或漏电保护器失灵。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_11_3", "title": "3.电焊机电源电缆线不应敷设在地面上，应埋地或架设。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_11_4", "title": "4.该推车的工人未戴安全帽、绝缘手套。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_12", "title": "12. [案例背景] 某报社工地，加夜班浇筑车库条型混凝土基础，一民工将混凝土振捣器接好线后就下班了，当混凝土工把混凝土填到基槽里后，刘某上来拿振捣器，刚拿起振捣器就喊着“哎呀…”，又一木工喊“触电了，快断电源。”另一民工用木棍、铁锹将振捣器电线铲断，刘某才脱离电源，在地下来回滚了几圈，送医院经抢救无效死亡。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_12_1", "title": "1.振捣器电源线中的相线和工作零线接反了使外壳带电，而开关箱中又未设漏电保护器，当刘某手拿振捣器时，触电死亡。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_12_2", "title": "2.工地没有对民工进行安全教育，所以，当发生触电事故时，民工不去拉闸断电，而是违章用木把的铁锹将电源线铲断。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_12_3", "title": "3.工地没设专职维修电工，而使用了一位不懂电的民工充当电工。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_12_4", "title": "4.工地管理不到位，夜班施工没有安排维修电工值班。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_13", "title": "13. [案例背景] 某汽车厂二期扩建工程，为加夜班浇筑混凝土，安排电工将混凝土搅拌机棚的三个照明灯接亮，当电工将照明灯接完线合闸试灯时，听见有人喊“电人了”立即将闸拉掉，可是手扶搅拌机位外倒混凝土的杨某倒地经医院抢救无效死亡。经查搅拌机开关箱的电源线是四芯电缆，其中零线已断掉，这个开关箱中照明和动力混设，N、PE混用。  请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_13_1", "title": "1.事故的直接原因是搅拌机接地线(PE)与照明器工作零线(N)共用一条零线，而且已经断线。当三个照明灯接通电源后，因共用零线已断，相线经灯具和共用零线连通搅拌机外壳致使其带电，当开灯时，杨某直接接触触电。 （   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_13_2", "title": "2.这段线路没按临时用电TN—S系统的要求使用五芯线，而是使用了四芯线，线路上没有专用保护零线(PE)，当共用零线断掉时，使设备失去接地保护。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_13_3", "title": "3.搅拌机开关箱中，没有设置漏电保护器，而且搅拌机处PE线未作重复接地。因此，当外壳漏电时因无漏电保护使操作者触电死亡。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_13_4", "title": "4.施工现场没必要将照明与动力两条线路分设。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_14", "title": "14. [案例背景] 某工地清晨上班不久，工人开始往已挖好的桩孔中安放钢筋笼。当第一个6m高钢筋笼被8个民工抬起，搬到孔洞的边上，准备放下去的时候，在南边角上的一个民工脚下踩空失稳，刚往下弯腰，钢筋笼随着向南倾倒，倒在了离孔洞边沿2.5m处的4m高的外电线路上，抬钢筋笼的8个民工中除一人幸免外，7人死亡。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_14_1", "title": "1.对穿过施工现场的外电线路，没按规定采取防护措施，将其与作业场所绝缘隔离。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_14_2", "title": "2.往深孔洞中放钢筋笼时，没有具体的施工方案，用人工抬放时没设专人监护。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_14_3", "title": "3.用人工抬放6m高的钢筋笼的方案是安全的。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_14_4", "title": "4.施工现场缺少安全监督管理，发现隐患，未及时排除。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_15", "title": "15. [案例背景] 2015年10月18日，宝鸡市某建筑工地挖掘机司机李某下班后私自对挖掘机液压执行系统的高压油管进行维修保养时，挖掘机铲斗坠落并砸中未戴安全帽的李某头部，在工地内作业的张某发现后立即拨打120急救电话；李某经抢救无效死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_15_1", "title": "1.挖掘机保养时无需将内燃机熄火。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_15_2", "title": "2.挖掘机检修时应将液压系统卸荷，并将铲斗落地。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_15_3", "title": "3.因为已经下班，张某可以不戴安全帽。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_15_4", "title": "4.李某私自对挖掘机液压执行系统的高压油管进行维修保养的行为属于违章行为。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_16", "title": "16. [案例背景] 2019年8月15日，安康市某建筑工地三名普工张某、王某和赵某吃完午饭后靠在停在工地内的振动压路机振动钢轮上休息；距中午上班前15分钟时，操作室中的司机李某未经检查便启动了压路机，造成赵某当场死亡，张某在事故发生后第6天死亡，王某在事故发生后第10天死亡。经查，司机李某无操作证，且安康市建筑机械实业有限公司拖欠李某工资六个月共计30000余元；张某、王某、赵某和李某均无三级安全教育资料及安全技术交底资料，其中张某和赵某系当天新入场工人。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_16_1", "title": "1.张某在事故发生后第6天死亡，事故发生单位应该重新上报事故伤亡情况。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_16_2", "title": "2.因为振动压路机不属于特种设备，所以司机李某只需要进行上岗培训并考核合格，无需持证上岗作业。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_16_3", "title": "3.该事故发生在中午下班时间，所以不能认定为工伤事故。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_16_4", "title": "4.该起生产安全事故的等级是（   ）。", "options": ["A.一般事故", "B.较大事故", "C.重大事故", "D.特别事故"], "correctIndex": 1}]},
            {"id": "js_al_17", "title": "17. [案例背景] 2016年6月3日上午，辽宁某体育场改造项目施工现场，进行深基坑开挖和支护作业。8时左右，司机刘某驾驶一台小型装载机，在深基坑坡道行驶过程中，装载机发生侧翻，将其砸伤致死。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_17_1", "title": "1.装载机在松散不平的场地作业时，应把铲臂放在浮动位置，使铲斗平稳推进，当阻力较大时，可稍微提升铲臂。 （   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_17_2", "title": "2.装载机在坡、沟边卸料时，轮胎离边缘应保留1.0m的安全距离。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_17_3", "title": "3.装载机下坡时不得空挡滑行。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_17_4", "title": "4.该起生产安全事故的等级是（   ）。", "options": ["A.一般事故", "B.较大事故", "C.重大事故", "D.特别事故"], "correctIndex": 0}]},
            {"id": "js_al_18", "title": "18. [案例背景] 2017年7月15日上午6时左右，盐城市某建设工程施工人员卢某在未经项目部通知的情况下(此前因配合创建文明城市，该项目部通知施工人员停工两天，待通知后复工)，带领孙某、袁某等2人进入施工现场，将2号桩机移到45号桩位准备打桩。卢某负责操作桩机上的卷扬机，袁某、孙某负责用钢丝绳套扣管桩。卢某等3人首先将第一节长15米的预应力管桩采取桩机底座水平侧向拖桩方式拖到位。6时20分左右，卢某等人拟将第二节长11米的预应力管桩自侧向方位斜向拖拉。该预应力管桩与桩机架距离约为20米，同时该桩长度方向与桩机卷扬机之间有十几度夹角。在拖拉时，该桩受到两侧堆放的其他预应力管桩的约束，拉力增大，超过了打桩机械可承受能力，导致桩导向架后侧支撑杆卡销断裂，桩架为此失去平衡倒塌。卢某、孙某、袁某等3人发现桩架开始倒塌，随即各自逃生。在逃生时，卢某被倒塌的桩架砸中。事故造成一人死亡，直接经济损失96.18万元。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_18_1", "title": "1.桩机不得侧面吊装或远距离拖桩。 （   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_18_2", "title": "2.桩机在正前方吊桩时，混凝土预制桩与桩机立柱的水平距离为5m。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_18_3", "title": "3.该起生产安全事故的等级是（   ）。", "options": ["A.一般事故", "B.较大事故", "C.重大事故", "D.特别事故"], "correctIndex": 0}, {"subId": "js_al_18_4", "title": "4.对于造成该起事故的原因分析中，以下属于事故的直接原因的是（   ）", "options": ["A.桩机施工单位对作业人员的安全教育和安全技术交底流于形式", "B.建设单位在与总包单位签订施工总承包合同的情况下将桩基工程肢解发包", "C.监理单位未履行监理职责", "D.卢某等人将预应力管桩自侧向方位斜向拖拉"], "correctIndex": 3}]},
            {"id": "js_al_19", "title": "19. [案例背景] 2021年5月9日，深圳某机械公司工人左某军和王某(有混凝土泵车有效操作证)将混凝土泵车驾驶至某施工现场，并在现场工人的配合下架设了臂架及支腿。随后工地混凝土浇筑班组王某礼、王某本等工人开始在一层走廊地面进行混凝土浇筑作业。泵车操作员王某负责操作混凝土泵车出浆，王某礼等人负责使用耙子将混凝士浆抹平，王某本则负责使用晃板将混凝土浆压实压平。9时30分左右，一层走廊地面混凝土已浇筑过半，此时王某操作泵车臂欲将其移动至下一个区域，在泵车臂架移动过程中，泵车臂架突然快速下坠，并出现较大幅度上下晃动。正在作业的王某本躲闪不及，被泵车臂架第五节未端两次撞击到背部，失稳倒地。王某经抢救无效死亡。事故造成一人死亡，直接经济损失165万元人民币。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_19_1", "title": "1.混凝土泵车作业前，应将支腿打开，并采用垫木垫平，车身的倾斜度不应大于15°。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_19_2", "title": "2.当布料杆处于全伸状态时，不得移动车身。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_19_3", "title": "3.对于造成该起事故的原因分析中，以下属于事故的直接原因的是（   ）", "options": ["A.混凝土泵车控制四节臂的油缸平衡阀锁止装置漏油", "B.混凝土泵车比较陈旧", "C.监理单位未履行监理职责", "D.王某本作业时走进混凝土泵车臂架晃动危险范围"], "correctIndex": 0}, {"subId": "js_al_19_4", "title": "4.混凝土泵车有效操作证不属于特种作业人员操作证（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_20", "title": "20. [案例背景] 有一项工程，需挖一条长l0m、宽2m、深3m的一条管沟，拟采用间断式水平支撑做土壁支撑，开工前没有搞安全技术交底和安全教育，对规范标准理解不深。没有按要求进行支撑而发生坍塌事故。请判断下列说法的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_20_1", "title": "1.两侧放水平挡土板，用撑木加木楔顶紧，挖一层土，支顶一层。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_20_2", "title": "2.两侧放水平挡土板，用撑木加木楔顶紧，待土全部挖完后，一次支顶。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_20_3", "title": "3.安全教育不到位不是此次事故的原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_20_4", "title": "4.没有进行安全交底不是此次事故的原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_21", "title": "21. [案例背景] 有一项工程设置了一道重力式挡土墙,该地土质松软，挡土墙基础埋深0.5m，墙后有一道山坡，施工过程中，挡土墙倒塌，引起土方边坡的坍塌。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_21_1", "title": "1.没按土质基础一般埋深为1.0~1.2m规定，此挡土墙基础埋置太浅。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_21_2", "title": "2.挡土墙埋置过深。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_21_3", "title": "3.山坡一边对挡土墙的压力过大，挡土墙失稳。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_21_4", "title": "4.没有进行安全技术交底。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_22", "title": "22. [案例背景] 某地市政排水工程因修城市地下水管道，挖土2.5m深建污水井，土质一类松软土，井坑挖好未放坡，无支撑，即开始砌砖，当井体抹灰时，原污水管道在一侧土的压力下，其接头被管道中污水冲开，大量污水涌人新水井，井下抹灰的工人来不及上来’，当场被污水淹死。  请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_22_1", "title": "1.挖土违反规定，不放坡、无支撑。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_22_2", "title": "2.无排水降水措施。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_22_3", "title": "3.对工人安全工作无交底。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_22_4", "title": "4.施工无专人监护。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_23", "title": "23. [案例背景] 某地二大酿酒厂要建一小型污水处理厂，需开挖1.5m深的基坑，无降水措施，放坡不大，无支护，两名工人加夜班挖剩余部分土，土质为回填土。离基坑1m外有原排污下水道，下水道向外渗水，夜里正当工人挖土时，原污水管突然爆裂，水冲泥土造成塌方，将两名工人压在土里，第二天发现二人死亡。  请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_23_1", "title": "1.无支护及降水措施。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_23_2", "title": "2.无监视作业人员。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_23_3", "title": "3.工人戴安全帽。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_23_4", "title": "4.无安全技术措施。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_24", "title": "24. [案例背景] 某建筑工地将挖基坑的土堆放在离基坑10m以外的一道砖砌围墙，围墙的外侧是一所小学校操场，土堆高于围墙。一场大雨过后，一天，小学生课余在操场活动中，突然围墙倒塌，将正在墙边玩耍的4名小学生压死在围墙底下。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_24_1", "title": "1.挖基坑的堆土不应堆在围墙边。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_24_2", "title": "2.小学生不应在围墙下边玩耍。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_24_3", "title": "3.挖土单位违反操作规程。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_24_4", "title": "4.挖基坑(槽)应按规定堆土。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_25", "title": "25. [案例背景] 某道路全长873米，管沟深2.5米，宽2米，主要采取水平支撑。在道路0+140~0+160米处，机械开挖后对管沟基底进行人工清理。工人吴某（死者）、刘某开始清理此事故段沟底。由于连续两天下雨，沟顶边上有部分回填土，加上在清理沟底时，吴某嫌支撑沟边的挡板碍事，于是就擅自将支撑的挡板拆掉三块，沟边土方于下午6点20突然坍塌，将吴某全身呈站立式埋入土中，经现场刨土救出后送医院抢救无效死亡。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_25_1", "title": "1.本次事故的直接原因是擅自拆除沟边支护，造成两边土方坍塌。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_25_2", "title": "2.现场安全检查、督察不力，未及时制止工人违章行为是本次事故的间接原因之一。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_25_3", "title": "3.连续两天降雨是导致此次事故的间接原因之一。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_25_4", "title": "4.没有制定事故应急救援预案，导致事故抢救不力是导致此次事故的间接原因之一。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_26", "title": "26. [案例背景] 二00三年四月二日十时许，某项目监理方对挡土墙基础进行验收中发现挡堵墙基础中段约10米长的基础不符合设计要求，于是要求施工单位加快进度，确保工程完工。施工单位工地安全员高某随即安排陈某组织工人对挡土墙基础宽度不够的部分（系淤泥和松软土结构，高度约13米，存在坍塌隐患）进行施工，由陈某和工人王某分别对基础上下进行监控，预防坍塌。下午十四时后，工人陆续返回施工。十四时十分，挡土墙后边坡发生大面积坍塌，造成在基础中施工的六名人员被泥土掩埋而死亡。请判断下列对事故分析描述内容是否正确。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_26_1", "title": "1.由于存在淤泥和松软土质结构，开挖基础后，造成底部空虚，难以承受上部压力，是事故的直接原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_26_2", "title": "2.施工过程中违反操作规程、冒险蛮干。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_26_3", "title": "3.陈某和工人王某分别对基础上下进行监控，预防坍塌的措施得当。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_26_4", "title": "4.没有进行安全技术交底。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_27", "title": "27. [案例背景] 某项目租用市水电工程机械队挖掘机开挖管沟。2003年3月29日2时10分左右，挖掘机将环卫局门口污水管网工程编号为WB8-WB9井间DN75毫米给水管挖断，给水管涌水将施工管沟淹没。为了及时抢修断裂的给水管，该项目队队长孙某在指派管理人员刘某联系电焊工焊接管道的同时，带队工长白某、张某沿街寻找给水阀门井准备关闭水源，大约在凌晨2时40分，误将某处给水检查井确认为给水阀门井，孙某指示电焊工王某找来洋镐撬开井盖，白先下井准备关闭闸阀，下井后立即昏倒，张见状即下井抢救也昏倒井内。地面上的孙某立即指派王某去工地叫人营救，他本人准备再下井抢救。王某与附近工地作业的刘某在赶往事故现场救人时，又叫看守工张某、挖掘机司机彭某一同赶到事故现场，当他们赶到井边时见地面无人，往检查井内探视时发现有三人躺倒。经120急救中心医护人员诊断，三人均属院前死亡。市、区公安局法医尸检后认为遇维者表面特证符合中毒窒息死亡特征。请判断下列对事故分析描述内容是否正确。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_27_1", "title": "1.挖断给水管道后，应及时向有关单位报告，而不是急于关闭闸门。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_27_2", "title": "2.建设单位应向建筑施工企业提供与施工现场相关的地下管线图纸。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_27_3", "title": "3.地下管道检查井不属于有限空间。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_27_4", "title": "4.进入地下管道检查井应按“先通风再作业”的程序进行。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_28", "title": "28. [案例背景] 某项目人工挖孔桩施工，某日周、黄二人挖3号孔，肖、徐二人挖4号孔。周某、黄某因抽水泵被堵死不能抽水，就在地面清理水泵，肖某在4号孔下挖掘，徐某在地面面拉土，当周某听到4号井的徐某在喊肖某在井下晕倒了，周某、黄某听到喊声立即跑到4号井一看，肖已经晕倒了，徐某跑到底下将肖某抱起，自己也晕倒了，周、黄随着也下去也晕倒了。后经119消防人员的抢救，全部吊上来，经医生查看4人均已窒息死亡。请判断下列对事故分析描述内容是否正确。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_28_1", "title": "1.项目安全管理不到位，责任不落实。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_28_2", "title": "2.缺乏应有的安全投入，安全装备和设施不到位，安全生产意识淡薄，是导致这次重大事故的间接原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_28_3", "title": "3.工人未经过安全培训，缺乏应有的安全知识，是导致这次事故的直接原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_28_4", "title": "4.现场无有限空间作业监护人员。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_29", "title": "29. [案例背景] 某年7月28日上午10时15分许，某项目的拆迁作业现场，董某指挥方某操作挖掘机进行地下挖掘；方某在发现地下不明管线时，仍用挖掘机抓头清理不明管线上的尘土，将丙烯管线抓破造成丙烯泄漏，旁边的一私家车主启动车辆时产生明火引发爆炸。共造成22人死亡，120人住院治疗，其中14人重伤，直接经济损失4784万元。请判断下列对事故分析描述内容是否正确。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_29_1", "title": "1.土石方作业前应检查施工现场，查明危险源。机械作业不宜在有地下电缆或燃气管道等2m半径范围内进行。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_29_2", "title": "2.土方工程施工前应针对安全风险进行安全教育及安全技术交底，机械操作人员应经过专业技术培训。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_29_3", "title": "3.地下丙烯管道的所有方，在此次施工中没有责任。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_29_4", "title": "4.方某在发现地下不明管线时，仍用挖掘机抓头清理不明管线上的尘土，将丙烯管线抓破，从而酿成事故。此行为均构成重大责任事故罪。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_30", "title": "30. [案例背景] 某单位将新招来的一批民工直接派到工地参加人工挖孔桩施工。其中一人挖土深度达到5m时，闻到异样气味，感觉头晕腿软，奋力呼叫地面同伴，由于没有系安全绳，地上的人费尽周折才把下面的人救上来，险些酿成伤亡事故。请判断下列对事件分析描述内容是否正确。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_30_1", "title": "1.此事件的违规之处在于，孔下作业人员未系安全绳。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_30_2", "title": "2.由于没有造成伤亡事故，所以可以认为没有违规。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_30_3", "title": "3.上述事件中，如果没有劳动合同，则即使发生了事故，也不属于施工单位的事故，可不予以上报。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_30_4", "title": "4.井下缺氧导致的此次事件。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_31", "title": "31. [案例背景] 某新建工程建筑面积10万平方米，项目前期，项目经理在临时建筑布置过程中遇到下列问题，根据《建设工程施工现场消防安全技术规范》规定，完成下列问题。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_31_1", "title": "1.施工现场场地狭小，布置的临时用房较多，项目经理认为可以将不同使用功能的临时用房进行组合建造。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_31_2", "title": "2.若可以组合建造时，两种不同使用功能的临时用房之间应采用（   ）材料进行防火分隔。", "options": ["A.不燃", "B.难燃", "C.可燃", "D.易燃"], "correctIndex": 0}, {"subId": "js_al_31_3", "title": "3.项目经理为了节省办公、生活区用房，将厨房操作间设置在一层并在厨房操作间上部设置为管理人员宿舍。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_31_4", "title": "4.为了满足办公需要，项目经理将会议室设置在临时用房的首层，同时为了丰富和方便职工，将文化娱乐室临时用房设置在二层，并将所有疏散门朝疏散方向开启。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_32", "title": "32. [案例背景] 某工程主体工程和外装修工程已基本完成，当4名工人乘施工升降机吊笼在该大厦第9层拆卸SSl00型升降机架体时，升降机吊笼从33m高处坠落至地面，造成4人死亡。经现场勘查，该工地拆除了架体顶部(大厦主体9-15层)的附墙杆，使架体上部自由高度达到16m，按照该施工升降机使用说明书规定，设置附墙杆使用的升降机，架体自由高度不得超过6m。违章拆除了架体顶部滑轮上钢丝绳防脱装置，防坠安全器失灵。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_32_1", "title": "1.违章拆除了架体顶部(大厦主体9-15层)的附墙杆，使架体自由高度超过6m，导致架体失稳。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_32_2", "title": "2.SSl00型钢丝绳升降机不允许载人。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_32_3", "title": "3.升降机吊笼的防坠安全器失灵，是导致事故的直接原因之一。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_32_4", "title": "4.由于违章拆除了架体顶部滑轮上钢丝绳防脱装置，导致防坠安全器失灵。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_33", "title": "33. [案例背景] 22.某工程的1号物料提升机吊笼停在二层，唐某进行卸料作业，操作人员临时离开。这时另一班组喊叫要求提升相邻的2号提升机，经过此地的工人胡某却开动了正在卸料的1号提升机；唐某正跨于吊笼与平台之间，上升的提升机把唐某掀翻，从二层井架平台坠落到井架底，头部撞在井架立杆上，抢救多日后，因颅内出血过重死亡。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_33_1", "title": "1.当有人在高处提升机吊笼处作业时，提升机操作人员擅自离岗。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_33_2", "title": "2.违反同一施工现场不得安装2台物料提升机的规定。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_33_3", "title": "3.唐某进行卸料作业时不应该进入吊笼。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_33_4", "title": "4.非提升机操作人员擅自操作提升机。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_34", "title": "34. [案例背景] 某工地准备安装一台ATC20塔机，此塔机无顶升系统，安装靠拔杆和自身起升卷扬系统完成。项目经理将安装任务承包给了本公司架子工班张某，张某组织了4个同乡开始安装。张某站在地面指挥，其余4人在塔机上作业。在起重臂拉起到与铰点安装高度呈水平位置准备安装起重臂拉杆销轴时，塔顶上的操作人员要求继续上拉起重臂，司机重新启动卷扬机，这时钢丝绳突然断裂，起重臂前端加速下摆撞击塔身下端，致使塔身瞬间失稳，随即倒塌，将塔顶上的3名操作人员甩下，造成3人当场死亡的较大事故。经现场勘察，起升卷扬钢丝绳发现毛刺且多处有断丝现象，钢丝绳断裂处断口不齐。参与安装的张某等5人均提供不出指挥及安装操作等相关证件。 请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_34_1", "title": "1.所有人员均提供不出指挥及安装操作等相关证件，违反了起重拆装作业人员必须持证上岗的规定。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_34_2", "title": "2.安装方案未经主管部门批准。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_34_3", "title": "3.进行拆装的作业人员数量太少，配合失误。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_34_4", "title": "4.钢丝绳有多处断丝且断裂处断口不齐，可以判定其安装前未对钢丝绳进行检查确认。 （   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_35", "title": "35. [案例背景] 某工地一台QTZ315水平变幅式塔机，起重臂为正三角形，臂架上无走台，变幅小车一侧设有检修栏。查使用说明书检修栏允许载荷为90kg。一次在更换起升绳时，旧绳已拆除，新绳在滑轮上已穿好，2名作业人员将新绳绳头系在起重小车上后同时站在检修栏内。此时小车向外变幅，行走约2m时小车检修栏侧导轮突然从起重臂轨道上脱出，另一侧导轮也脱离正常位置，只剩检修栏对侧一个导向轮座将小车挂在起重臂上，2人从约30m高的高空摔下，造成2人当场死亡的安全事故。经现场勘察，作业人员未系安全带，塔机变幅绳未断裂，起重臂和变幅小臂未发现变形，小车脱轨附近轨道未发现金属划痕，小车轮为带轮缘结构，小车上无侧导向轮，小车自重为147㎏。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_35_1", "title": "1.小车上未按《塔式起重机安全规程》要求设置小车防脱轨装置或防脱轨装置失效。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_35_2", "title": "2.违反使用说明书的限载规定，检修栏限载90kg却站了2人，使小车在无吊载状态下偏载严重，极易造成小车轮脱轨，使隐患发展为事故。    （   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_35_3", "title": "3.小车上未按《塔式起重机安全规程》要求设置小车行程限位装置或小车行程限位失效。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_35_4", "title": "4.违反了高处作业人员必须系安全带的规定。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_36", "title": "36. [案例背景] 正在施工的某建筑工程，主体已经完工，准备迎接验收。项目负责人徐某安排工人当晚加班清扫6层楼面，临时指派无证人员李某使用物料提升机运送废料。当晚20时左右，李某操作卷扬机时突然发现吊篮在下降过程中卡在6层与5层之间，于是又操纵提升物料提升机，吊篮还是不能动。木工班班长黄某和机修工王某听到召唤后随即带着橇杠由6层运料平台爬到卷场提升机吊篮上查看，发现吊篮南侧已滑出轨道。于是2人用橇杠将吊篮拨回轨道，随后乘吊篮下来。吊篮下降近2m又不动了，站在吊篮上的黄某便叫司机提升，此时提升钢丝绳断裂，黄、王二人随吊篮一同坠落地面，当场死亡。根据事故调查，吊篮坠落时，钢丝绳断头在卷扬机卷筒处，卷筒外缘及底座有明显的钢丝绳环绕磨擦痕迹。请判断下列事故原因分析和责任认定的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_36_1", "title": "1.司机李某是临时人员，未经专门培训，不懂卷扬机安全操作规程，违章操作，应对事故负直接责任。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_36_2", "title": "2.由于卷扬机卷筒边缘没有防脱绳装置，致使钢丝绳跑出卷筒边缘，绕在了卷扬机的底座上。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_36_3", "title": "3.黄某、王某修理吊篮脱轨，高空作业未按规定系安全带，进入吊篮前又未对吊篮采取防坠落保护措施；吊篮拨回轨道后，违反规定乘坐吊篮。    （   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_36_4", "title": "4.项目负责人徐某临时指派无证人员李某操作物料提升机，应对此次事故负有重要责任。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_37", "title": "37. [案例背景] 某公寓楼工程发生了一起施工升降机吊笼冒顶坠落事故，造成吊笼内的3名员工死亡。该工程由裙房相连的A.B.C三幢32层高层公寓楼组成，施工总承包单位某建筑公司将该工程的部分装饰工程分包给某装饰公司。事故发生时，工程外墙装修即将结束，内装修进入修补阶段。A楼的施工升降机已拆卸至13层高度。发生事故的施工升降机位于A楼，由某设备租赁公司提供并负责日常维修检查工作，总承包单位工程项目部使用并配备了电梯司机。事故发生当日6时20分左右，某装饰公司员工鲍某等3人在电梯司机尚未上班到岗的情况下，擅自驾乘A楼施工升降机右笼前往7层，在上升过程中，由于上极限开关未起作用，上行停车操作失控，发生吊笼冒顶，酿成事故。请判断下列事故原因分析和责任认定的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_37_1", "title": "1.该施工升降机上极限开关安装不合格，动作杆不稳固，造成上极限开关动作不灵敏。在吊笼上升过程中，因上极限开关动作杆松动，碰到限位块时缩回，致使极限开关失灵。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_37_2", "title": "2.某装饰公司对施工升降机的日常维护不到位。未对进入吊笼和升降机控制按钮采取有效的隔离和封闭措施，造成施工人员可以随意进入吊笼，开启操作升降机。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_37_3", "title": "3.鲍某等3人非电梯司机，无证且擅自操作施工升降机，对事故应负直接责任。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_37_4", "title": "4.工程监理公司在施工现场对发现的职工无证操作施工升降机等违章违规行为，未采取有效措施加以制止，对此次事故负有主要责任。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_38", "title": "38. [案例背景] 某高层住宅工地，由于进行清理墙面未经施工负责人同意将15层的电梯井预留口防护网拆掉，作业完毕未进行恢复。抹灰班张某上厕所随便在转弯处解手，不小心从电梯井预留口掉了下去，当场摔死。经现场勘查，电梯井内未设防护网。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_38_1", "title": "1.未经施工负责人同意随意拆除安全防护设施，在作业完毕未立即恢复是事故发生的直接原因之一。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_38_2", "title": "2.张某不文明施工，事故全部责任由张某自负。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_38_3", "title": "3.电梯井内未按规定挂设防护平网。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_38_4", "title": "4.张某未将拆除的防护网恢复。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_39", "title": "39. [案例背景] 某工地，早晨上班，土建队的木工班继续拆除热电厂蒸发站工程7m高的混凝土平台模板，当一名工人从4-5轴线中间的钢窗进入操作地点时，他左手攀着钢窗开窗器立管跃入室内，突然喊了两声“电着我了”。该班长立即跑去找电工切断电源线，但因电源来自安装队使用的卷扬机上的电源线，土建队电工不清楚，直到7、8分钟后，才切断电源，触电工人经抢救无效死亡。经查拆除的模板钢支架由4.8m处落下，一端砸断了卷扬机的电源线，另一端倒在拆下的钢管上，钢管又搭在钢窗上。  请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_39_1", "title": "1.事故的直接原因是卷扬机电源线被轧断后，又与钢管和钢窗相连，使钢窗带电，工人手扶钢窗触电死亡。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_39_2", "title": "2.模板拆除前，虽然编写了拆除方案，也做了交底，但对作业环境存在的隐患，没有考虑。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_39_3", "title": "3.拆模前，未对下方的环境进行检查确认和整改，导致拆下的钢管和钢支架从4.8m处落下，轧断了电源线。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_39_4", "title": "4.卷扬机电源线敷设没有按照规定埋地或穿管保护，是导致本次事故的又一原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_40", "title": "40. [案例背景] 某项目租赁了一台QTC25A塔式起重机，该塔机厂雇用李某进行首次安装。按照塔机安装的程序，塔身、塔帽、配重臂安装完毕后，着手安装起重臂(该塔机是自装式水平臂塔机)。起重臂在安装时对吊点位置、吊索的拴系方式、重心所处位置均有严格的技术要求。按照要求应设置六倍率吊索。李某等人设置了2个吊点，使用4根钢丝绳，在吊索未拴牢的情况下，将起重臂拉起，在安装拉杆时，吊点处的钢丝绳在冲击力的作用下，将起重臂两根侧向斜腹杆拉断后，向起重臂根部水平方向移动约450mm。起重臂瞬间下沉，造成钢丝绳断裂，起重臂以铰接点为轴心坠落，在起重臂上的五名操作工人随之坠落，造成4人死亡，1人受伤。经事故调查，该塔机无技术图纸，无生产工艺，无产品检验报告，作业人员未系安全带，无证作业。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_40_1", "title": "1.该塔机生产厂违规雇用无安装资质的个人安装塔机。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_40_2", "title": "2.该QTC25A起重机产品属合格产品，但无产品检验报告。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_40_3", "title": "3.安装时吊点设置不合理，少设了1个吊点，使2根侧向斜腹杆承受的安装自重载荷过大，造成斜腹杆被拉断。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_40_4", "title": "4.特种作业人员无证上岗，高空作业无任何安全防护措施。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_41", "title": "41. [案例背景] 某花园小区5号楼工地，需拆除一台QTG40塔机。此台塔机产权拥有者李某，将塔机的拆除工程承包给沈阳市某建筑公司机运站维修安装电工石某，石某私招5名工人进行拆卸。当拆卸到第十一个标准节并将第一个标准节降到地面后。在塔机未进行调整平衡力矩的情况下，司机徐某作出回转动作和变幅小车向内运行的动作并调整顶升套架滚轮与塔机之间的间隙。此时另一个安装工人开动了液压顶升系统进行顶升，液压油管突然爆裂，平衡臂折断后砸向塔身后部，造成塔身剧烈晃动，致使顶升踏步严重变形，失去支撑能力，继而塔机起重臂、回转机构、顶升套架、塔顶等部件整体坠落，塔身折断。在顶升套架作业的人员，除1人幸免外，其余4人3死1伤，酿成悲剧。请判断下列事故原因分析和责任认定的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_41_1", "title": "1.在塔机未进行调配平衡力矩的情况下，司机违章作出回转动作和变幅小车向内运行的动作，造成起重臂与配重臂的前后力矩不平衡。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_41_2", "title": "2.在塔机力矩不平衡的情况下，另一个安装工人开动了液压顶升系统进行顶升，加大了塔身的稳定性。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_41_3", "title": "3.塔机产权者无视法规将任务承包给无能力、无资质的个人，应负主要责任。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_41_4", "title": "4.现场无指挥协调，管理混乱，各工种操作随意，塔机生产厂家应负管理责任。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_42", "title": "42. [案例背景] 某项目施工现场，大模板吊装施工时，由于起吊和落点相距较远，信号工张某（老板亲戚，无证临时指挥）未能及时赶到大模板落点位置指挥，塔吊司机王某根据工人李某的指挥落板，结果钢模板砸到工人李某的脚上，造成李某骨折入院。试判断下列说法的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_42_1", "title": "1.临时信号工张某不需要特种作业证。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_42_2", "title": "2.塔吊司机王某违章操作，未在信号工的指挥下落钢模板。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_42_3", "title": "3.塔吊司机王某属于特种作业人员。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_42_4", "title": "4.信号指挥不明不准吊属于十不吊的内容。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_43", "title": "43. [案例背景] 某项目在进行铝模板安装，王某在未背安全带的情况下爬上2.5高的操作平台进行施工，并将用于施工的扳手、钳子等工具放置在已安装好的铝顶板边缘，王某施工中不小心碰落放置在边缘的工具，由于时值夏日天气炎热，且恰逢不戴安全帽的赵某从下方走过，掉落工具直接砸中赵某的脑袋，随后赵某被紧急送医。试判断下列说法的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_43_1", "title": "1.王某在2.5米高的操作平台施工不需要背安全带。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_43_2", "title": "2.王某应当将小工具放在随身携带的工具包里。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_43_3", "title": "3.天气炎热，可以根据实际情况不佩戴安全帽。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_43_4", "title": "4.夏季高温施工要注意防暑降温，可以喝饮料来补充体能。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_44", "title": "44. [案例背景] 某项目大钢模板施工时，由于操作不当，导致一块大模板端部焊口开焊，随后带班张某安排临时工王某（无焊工证）拿焊机进行补焊施工，王某在施焊过程中引燃了附近堆放的安全网，随之引燃该区域方木堆放区，由于周围没有灭火器，着火后火灾无法第一时间得到控制，随即张某拨打119，最后在消防员的努力下才熄灭了大火。试判断下列说法的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_44_1", "title": "1.王某电焊作业应当取得特种作业证书。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_44_2", "title": "2.动火作业应当办理动火许可证，配备灭火器材，安排监护人。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_44_3", "title": "3.带班张某根据实际情况安排工作，没有违章指挥。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_44_4", "title": "4.动火作业前配备了灭火器后无需再清理周围可燃物。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_45", "title": "45. [案例背景] 某建筑公司承建某政府办公楼项目，由具有相应资质的施工单位承担在施工现场主体施工任务，该工程模板施工全部采用碗扣式脚手架进行搭设，局部模板支架高度达到10米，编制专项施工方案并经过了专家论证；", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_45_1", "title": "1.该碗扣式脚手架高度10米，应该由（   ）来组织专家论证", "options": ["A.建筑公司", "B.政府", "C.监理单位", "D.设计单位"], "correctIndex": 0}, {"subId": "js_al_45_2", "title": "2.施工单位编制模板工程专项施工方案后报送监理单位，由（   ）进行审查；", "options": ["A.项目技术负责人", "B.施工单位技术负责人", "C.监理工程师", "D.总监理工程师"], "correctIndex": 3}, {"subId": "js_al_45_3", "title": "3.碗扣式模板支架施工过程中，永久荷载不包括（   ）", "options": ["A.架体结构自重", "B.模板及支撑梁的自重", "C.施工作业人员的自重", "D.作用在模板上的混凝土和钢筋的自重"], "correctIndex": 2}, {"subId": "js_al_45_4", "title": "4.该建筑公司在碗扣式模板支架搭设过程中（   ）制定本单位生产安全事故应急救援预案，建立应急救援组织或者配备应急救援人员，配备必要的应急救援器材、设备，并定期组织演练。", "options": ["A.不必", "B.应当", "C.视情况决定是否需要", "D.按当地建设局的要求"], "correctIndex": 1}]},
            {"id": "js_al_46", "title": "46. [案例背景] 某工地搭设碗扣式模板支架，未进行安全技术交底，在混凝土达到设计要求后，工人在拆除楼板模板时，尚未办好审批手续。由于面积大，模板未拆完。中午吃饭时，工人吴某从未拆完的模板下经过，突然上边已活动的几块模板掉了下来，刚好击中吴某头部，经抢救无效死亡。请根据以下问题分析。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_46_1", "title": "1.该建筑公司在碗扣式模板支架搭设过程前，应由（   ）对作业人员进行安全技术交底", "options": ["A.施工员", "B.班组长", "C.安全员", "D.项目经理"], "correctIndex": 0}, {"subId": "js_al_46_2", "title": "2.在碗扣式模板支架搭设过程中，下列说法不正确的是（   ）", "options": ["A.脚手架搭设人员必须经岗位作业能力培训考核合格后，方可持证上岗", "B.操作人员应正确佩戴安全帽、安全帽和防滑鞋", "C.当遇到五级及以上强风、浓雾、雨或雪天气时，应停止脚手架搭设作业", "D.夜间不宜进行脚手架搭设作业"], "correctIndex": 2}, {"subId": "js_al_46_3", "title": "3.当脚手架拆除时，应按专项施工方案中规定的顺序拆除，下列做法错误的是（   ）", "options": ["A.预应力混凝土构件的架体拆除应在预应力施工完成后进行", "B.应先拆除后搭设的部分，后拆除先搭设的部分", "C.架体拆除必须自上而下逐层拆除，严禁上下层同时拆除", "D.梁下架体的拆除，宜从两端开始，对称的向跨中拆除"], "correctIndex": 3}, {"subId": "js_al_46_4", "title": "4.该起事故属于（   ）", "options": ["A.一般事故", "B.较大事故", "C.重大事故", "D.特备重大事故"], "correctIndex": 0}]},
            {"id": "js_al_47", "title": "47. [案例背景] 一层大堂搭设满堂盘扣式支模架，立杆顶部悬臂高度800mm。当浇筑混凝土时，模板倒塌，砸伤了架底加固的工人。请判断下列对事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_47_1", "title": "1.该支模架立杆顶部悬臂高度过高。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_47_2", "title": "2.混凝土浇筑前未做安全技术交底。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_47_3", "title": "3.作业人员安全教育不到位。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_47_4", "title": "4.支模架在浇筑前进行了联合验收,且验收合格。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_48", "title": "48. [案例背景] 某项目局部存在荷载较大支模区域，项目部拟采用重型盘扣式支模架，工人在搭设时发现重型杆件不足，便将不足部分使用标准型杆件代替。混凝土浇筑时，架体失稳坍塌。试分析可能导致事故发生的原因。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_48_1", "title": "1.可以使用标准型杆件代替重型杆件使用。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_48_2", "title": "2.混凝土浇注前架体验收不到位。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_48_3", "title": "3.安全技术交底不到位。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_48_4", "title": "4.管理人员巡检不到位。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_49", "title": "49. [案例背景] 某酒店项目，一层大厅层高14m。施工单位根据现场实际情况制定了下述方案：采用盘扣式支撑架进行支模，支模架长4.2m，宽3m，立杆纵横向间距0.6m，步距1.5m，并分别在首层和顶层设置了水平剪刀撑。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_49_1", "title": "1.该支模架应该与周围既有主体结构进行刚性连接或增加抗倾覆措施。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_49_2", "title": "2.架体搭设前应做两级交底。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_49_3", "title": "3.该方案不需要专家论证。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_49_4", "title": "4.该支模架水平剪刀撑数量过少。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_50", "title": "50. [案例背景] 在施工现场搭设了一个长6m、宽0.6m、高4.5m的现浇混凝土梁的模板，其支撑用φ48和φ51的两种型号钢管直接支撑在地面上，浇筑混凝土时，支撑下地面沉陷，模板严重变形。  请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_50_1", "title": "1.钢管底端未加垫板和底座。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_50_2", "title": "2.两种钢管混用。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_50_3", "title": "3.操作不当。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_50_4", "title": "4.无交接工序验收单。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_51", "title": "51. [案例背景] 某工程因抢进度，提前拆除模板。该楼四层楼板在制定拆除方案时，未考虑安全措施，也未经审批。在接近拆完时，突然一大片混凝土楼板掉落，4名拆模工人压在下边，经抢救无效死亡。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_51_1", "title": "1.提前拆模时未经审批。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_51_2", "title": "2.违反拆模前必须制定安全措施的规定。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_51_3", "title": "3.拆除前应有安全交底。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_51_4", "title": "4.工人未系安全带。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "js_al_52", "title": "52. [案例背景] 某工地一名工人站在一楼的窗台上与墙顶的另一工人共同安装钢模板，半小时后，站在墙顶的工人不小心从墙上摔下。请判断下列事故原因分析的对错。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_52_1", "title": "1.未按规定搭设脚手架及安全网。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_52_2", "title": "2.未设置操作平台脚手板。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_52_3", "title": "3.未进行安全技术交底。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_52_4", "title": "4.工人未系安全带。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "js_al_53", "title": "53. [案例背景] 某单位施工一处建筑面积52000平方米的房屋建筑，当地安全监督管理部门在巡查过程中发现该项目的临时建筑如下设计，根据《建设工程施工现场消防安全技术规范》规定，完成下列问题。", "image": "", "isCase": true, "subQuestions": [{"subId": "js_al_53_1", "title": "1.厨房操作间、食堂进行组合建造，且全部设置在一层，二层上设置管理人员宿舍。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_53_2", "title": "2.将施工现场的发电机房、变配电房进行组合建造，为了监控方便，在变配电室设置电工宿舍。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "js_al_53_3", "title": "3.为了方便职工办公生活及娱乐，将文化娱乐室、培训室与办公用房或宿舍进行组合建造。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "js_al_53_4", "title": "4.施工现场人员较为密集的会议室、文化娱乐室、培训室、餐厅，其房间门应朝（   ）方向开启，以便于人员紧急疏散。", "options": ["A.内", "B.左", "C.疏散", "D.都行"], "correctIndex": 2}]}
        ],
        "管理案例": [
            {"id": "gl_al_1", "title": "1. [案例背景] 张某在县城某工地，从事后期修补工作。项目部因后期现场条件受限，宿舍及办公区设置于在建商铺内。工人宿舍设置在商铺一层采用通铺，每间商铺内住20人。职工食堂紧靠厕所，无隔油池及油烟净化装置，食堂操作人员非专业厨师，上岗作业期间未佩戴口罩，服装不整洁。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_1_1", "title": "1.宿舍及办公区允许设置在建商铺内。(     )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_1_2", "title": "2.施工现场生活区宿舍，每间房内最多允许住（    ）人。", "options": ["A.20", "B.16", "C.12", "D.8"], "correctIndex": 1}, {"subId": "gl_al_1_3", "title": "3.食堂未设置隔油池及油烟净化装置，不符合相关规定要求。(    ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_1_4", "title": "4.食堂操作人员上岗期间应佩戴口罩、穿着整洁。（    ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_2", "title": "2. [案例背景] 某市一建设项目，因施工工艺要求，分为昼夜连续施工，夜间进行施工过程中，施工现场内车辆鸣笛高速行驶，导致路面扬尘。靠近居民区一边噪音值为75dB，远离居民区一边噪音值为103dB。现场材料装卸过程中，由车辆自卸产生较大噪音。周围居民多次进行投诉，建设项目仍未采取相关措施。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_2_1", "title": "1.车辆在施工现场不允许鸣笛高速行驶。（    ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_2_2", "title": "2.靠近居民区噪音值75dB在噪音排放标准内。（    ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_2_3", "title": "3.材料装卸过程中应该轻拿轻放，避免产生较大噪音。（    ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_2_4", "title": "4.施工现场裸露的场地和堆放的土方应采取（    ）、固化或绿化等措施。", "options": ["A.覆盖", "B.洒水", "C.隔离", "D.清扫"], "correctIndex": 0}]},
            {"id": "gl_al_3", "title": "3. [案例背景] 某采石场地的作业场所存在大量的白云石粉和大理石粉，为防止粉尘飞扬，降低作业场所粉尘浓度，有效防范职业危害，采取了局部送风和排风净化除尘的措施。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_3_1", "title": "1.该采石场主要采取的控制技术措施有效。（    ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_3_2", "title": "2.该采石场采取的控制技术措施无效，应采用湿式作业和密闭抽风除尘措施。（    ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_3_3", "title": "3.长期在采石场工作的作业人员发生职业病并经鉴定与该工作环境有直接关系的可以提出相关职业病赔偿。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_3_4", "title": "4.长期在采石场工作的作业人员可能会患矽肺病。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_4", "title": "4. [案例背景] 某生态旅游风景区建设项目，发生一起火灾事故，事故造成1人死亡、2人重伤。事故发生后，现场有关人员立即如实向本企业负责人报告，并逐级上报事故。事故调查中发现该项目部未编制消防应急救援预案，未开展消防应急演练。根据以上内容，回答下列问题：", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_4_1", "title": "1.根据《施工企业安全生产管理规范》（GB50656-2011），企业负责人按规定应在（   ）内如实向事故发生地县级以上人民政府建设主管部门和有关部门报告。", "options": ["A.0.5h", "B.1.5h", "C.1h", "D.2h"], "correctIndex": 2}, {"subId": "gl_al_4_2", "title": "2.根据《施工企业安全生产管理规范》（GB50656-2011），施工企业生产安全事故报告应包括导致事故发生的主要原因分析。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_4_3", "title": "3.该事故造成1人死亡、2人重伤，属于较大事故。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_4_4", "title": "4.根据《施工企业安全生产管理规范》（GB50656-2011），项目部应组织对现场管理人员进行应急救援预案的培训和交底，定期组织专项应急演练。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_5", "title": "5. [案例背景] A 公司委托具有相应资质的 K 企业承接 3 厂房顶棚夹芯彩钢板更换工程。K 企业作业人员进入现场施工，搭建了移动式脚手架，施工作业过程中，K 企业临时雇佣 5 名作业人员参与现场作业时，移动式脚手架踏板与脚手架之间的挂钩突然脱开，导致踏板脱落，随即脚手架倒塌，造成脚手架上 3 名作业人员坠落地面，地面 10 名作业人员被脱落的踏板、倒塌的脚手架砸伤。事故导致 10 人重伤、3 人轻伤。事故调查中发现，施工单位未对临时雇佣的 5 名作业人员进行安全培训和安全技术交底；作业过程中，移动式脚手架滑轮未锁定；现场安全管理人员未及时发现隐患。根据以上场景，回答下列问题：", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_5_1", "title": "1.根据《施工企业安全生产管理规范》（GB50656-2011）和《生产安全事故报告和调查处理条例》，该起事故的等级为（   ）。", "options": ["A.重大事故", "B.一般事故", "C.较大事故", "D.特大事故"], "correctIndex": 2}, {"subId": "gl_al_5_2", "title": "2.根据《施工企业安全生产管理规范》（GB50656-2011）施工企业通过（   ）掌握安全生产管理活动运行的动态，发现并纠正安全生产管理活动或结果的偏差，并为确定和采取纠正措施或预防措施提供信息。", "options": ["A.安全教育", "B.安全检查", "C.安全交底", "D.安全例会"], "correctIndex": 1}, {"subId": "gl_al_5_3", "title": "3.根据《施工企业安全生产管理规范》（GB50656-2011），K企业应该对临时雇佣的5名作业人员进行岗前安全教育培训。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_5_4", "title": "4.根据《施工企业安全生产管理规范》（GB50656-2011）,为有效预防此类事故再次发生，应采取的安全技术措施包括搭设有效可靠的脚手架、踏板满铺，不使用单板、浮板和探头板和设置符合标准的防护栏杆。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_6", "title": "6. [案例背景] 某施工单位具有房屋建筑工程施工总承包特级资质，在某城市承接了装配式住宅小区工程，建筑面积 170000㎡，单体工程设计高度为 68m。工程处于主体结构施工阶段。 现场情况包括：基坑降水（开挖深度 7.80m）、落地式扣件钢管脚手架（搭设高度 25m）、悬挑式脚手架、型钢悬挑卸料平台、施工升降机、装配式建筑混凝土预制构件安装和混凝土模板支撑体系（搭设高度 4m、跨度 20m）。根据以上场景，回答下列问题：", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_6_1", "title": "1.根据《施工企业安全生产管理规范》（GB50656-2011），该施工单位应设置安全生产管理机构，配备专职安全生产管理人员至少应为（   ）。", "options": ["A.4 人", "B.5 人", "C.6 人", "D.7人"], "correctIndex": 2}, {"subId": "gl_al_6_2", "title": "2.根据根据《施工企业安全生产管理规范》（GB50656-2011），施工企业应根据施工组织设计、专项安全施工方案（措施）编制和审批权限的设置，分级进行安全技术交底，编制人员应参与安全技术交底、验收和检查。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_6_3", "title": "3.根据《施工企业安全生产管理规范》（GB50656-2011），工程项目部在组织装配式建筑混凝土预制构件安全施工时，项目技术负责人向现场管理人员进行方案交底，在施工现场显著位置公告危险性较大的分部分项工程名称、施工时间和责任人员，项目专职安全生产管理人员组织模板支撑体系验收。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_6_4", "title": "4.落地式扣件钢管脚手架（搭设高度25m）属于危险性较大的分部分项工程，型钢悬挑卸料平台不属于危险性较大的分部分项工程。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "gl_al_7", "title": "7. [案例背景] 甲公司将某四层现浇混凝土结构的房屋拆除项目委托给乙公司，由于工程量小，工期短，甲乙双方未签订承包合同和安全管理协议。乙公司组织相关技术和安全人员现场实地查看后，认为拆除工程简单，直接找到丙施工队，由丙具体负责拆除施工；拆除至三层西墙体时，作业人员用大锤对墙下1米处先凿洞、再掏空，最后砸断四周柱脚，致使墙柱突然垮塌，导致3人死亡、2人受伤。根据以上场景，回答下列问题：", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_7_1", "title": "1.甲乙双方未签订承包合同和安全管理协议的做法是否正确。（  ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_7_2", "title": "2.下列的说法错误的是（   ）", "options": ["A.乙公司应编制拆除工程安全专项施工方案，并履行相应的审批和论证程序。", "B.丙施工队应组织对作业人员进行安全技术交底", "C.乙公司应组织对作业人员进行安全技术交底", "D.乙公司和丙施工队不需要签订安全生产协议"], "correctIndex": 3}, {"subId": "gl_al_7_3", "title": "3.乙公司应安全专职安全员现场旁站监督，及时制止施工队的违章行为。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_7_4", "title": "4.施工队的拆除顺序是否正确（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},

            {"id": "gl_al_9", "title": "9. [案例背景] 某建筑企业公司在建项目，在应对施工企业安全生产考核时，各项制度的落实，及资料的整编均不符合要求，并在资料检查过程中发现有安全事故发生，评定考核不合格，则该项目被下发停工令，限期整改，并上报复检。根据以上内容，回答下列问题：", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_9_1", "title": "1.根据《施工企业安全生产评价标准》，下列不属于施工现场安全管理评价评定项目的是（   ）", "options": ["A.安全生产责任制度", "B.安全文明资金保障制度", "C.安全教育培训制度", "D.施工组织设计"], "correctIndex": 3}, {"subId": "gl_al_9_2", "title": "2.施工企业安全生产条件单项评价的内容包括（   ）分项。", "options": ["A.2", "B.3", "C.4", "D.5"], "correctIndex": 2}, {"subId": "gl_al_9_3", "title": "3.安全防护措施和（   ）不符合安全色与安全标志规定要求，扣5分。", "options": ["A.警示、警告标识", "B.安全设施", "C.安全记录", "D.安全标志"], "correctIndex": 0}, {"subId": "gl_al_9_4", "title": "4.施工企业安全生产评价标准评定为基本合格的的前提条件是：如果造成安全事故造成死亡人数累计超过（   ）人，或直接造成经济损失累计（   ）万元以上，则评定为不合格。", "options": ["A.2 30", "B.3 30", "C.2 50", "D.5 50"], "correctIndex": 1}]},

            {"id": "gl_al_17", "title": "17. [案例背景] 榆林建筑施工与装饰装修工程有限公司刚刚成立，需要制定企业职业健康安全管理体系，目前正在进行管理体系策划，请根据《GB/T 45001—2020/ISO职业健康安全管理体系要求》的内容，回答下面的问题。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_17_1", "title": "1.在进行管理体系策划时，不需要考虑哪些因素，来确定需要应对的风险与机遇。（  ）", "options": ["A.考虑组织及其所处的环境", "B.考虑职业健康安全管理体系范围", "C.考虑相关方所提及的要求", "D.考虑工程项目特点的要求"], "correctIndex": 3}, {"subId": "gl_al_17_2", "title": "2.在进行管理组织策划时，为了确定与体系及与其有关的风险和机遇，组织不应该（   ）。", "options": ["A.考虑危险源", "B.考虑职业健康安全风险和其他风险", "C.考虑职业健康安全体系的沟通与协调机制的建立", "D.考虑所涉及的法律法规的要求"], "correctIndex": 2}, {"subId": "gl_al_17_3", "title": "3.在策划过程中，组织应结合组织及其过程或职业健康安全管理体系的变更来确定和评价与职业健康安全管理体系预期结果有关的风险和机遇。对于所策划的变更，无论是永久性的还是临时性的，这种评价均应在变更实施前进行。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_17_4", "title": "4.在进行措施的策划时，所应考虑的措施中，不正确的是（   ）。", "options": ["A.如何在其职业健康安全管理体系过程中或其他业务过程中融入并实施这些措施", "B.如何评价这些措施的有效性", "C.在策划措施时，控制的层级和职业健康安全管理体系的输出由最高管理者来确定", "D.在策划措施时，组织还应考虑最佳实践、可选技术方案以及财务、运行和经营等要求"], "correctIndex": 2}]},

            {"id": "gl_al_19", "title": "19. [案例背景] 某小区十号楼地下室有一电气设备，该设备一次电源线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装该设备的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_19_1", "title": "1.本事故的主要原因之一是违章操作，移动电器设备未切断电源。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_19_2", "title": "2.特种作业人员必须按照国家有关规定经过专门的安全作业培训，并取得特种作业操作资格证书后，方可上岗作业。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_19_3", "title": "3.下列属于特种作业人员的是(   )。", "options": ["A.电工", "B.木工", "C.水暖工", "D.瓦工"], "correctIndex": 0}, {"subId": "gl_al_19_4", "title": "4.下列关于特种作业的说法正确的是(   )。", "options": ["A.特种作业人员未经培训考核即从事特种作业并造成重大安全事故，不得追究其刑事责任", "B.对特种作业人员专门的安全作业培训，是指由有关主管部门组织的专门针对特种作业人员的培训", "C.特种作业是指容易发生人员伤亡事故，对操作者本人、他人及周围设施的安全有重大危害的作业", "D.特种作业人员可不考核从事相应工种作业的疾病和生理缺陷情况"], "correctIndex": 1}]},
            {"id": "gl_al_20", "title": "20. [案例背景] 某工地，焊接一膨胀水箱。焊工在完成了4/5的工作量下班后，工地负责人又安排了油漆工将焊好的部分刷上防锈漆。因场地通风不良，到第二天油漆未干。焊工上班后，未采取相应措施继续施焊，造成水箱内油漆挥发气体爆炸燃烧，焊工被烧灼伤。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_20_1", "title": "1.从上述案例中应吸取的主要教训是：工地负责人应严格按焊接要求组织生产，合理安排工序，进行有针对性的安全技术交底，不能强令工人冒险作业。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_20_2", "title": "2.施工现场动火前、动火过程中要严格进行环境安全检查。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_20_3", "title": "3.施工现场油漆作业与焊接作业可同时进行。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_20_4", "title": "4.下列施工现场消防器材的配备说法正确的是(   )。", "options": ["A.临时搭设的建筑物区域内，每lOO㎡配备5只10L灭火器", "B.大型临时设施总面积超过50000㎡，应备有专供消防用的太平桶、积水桶(池)、黄砂池等设施，上述设施周围不得堆放物品", "C.临时木工间、油漆间和木、机具间等每25㎡配备一只种类合适的灭火器", "D.30m高度以上高层建筑施工现场，应设置具有足够扬程的高压水泵或其他防火设备和设施"], "correctIndex": 2}]},
            {"id": "gl_al_21", "title": "21. [案例背景] 某建筑公司在月度安全检查中，发现3号工地脚手架搭设存在如下问题：①超过24m高的脚手架没有搭设方案，无审批手续；②采用的分段整体提升脚手架未经审查批准；③部分使用的脚手架材料规格不一；④搭设架子的基础多处出现不平整，个别立杆悬空等等。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_21_1", "title": "1.为避免施工中引发脚手架坍塌事故伤害作业人员，脚手架立即停止使用。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_21_2", "title": "2.上述安全检查中发现的“超过24m高的脚手架没有搭设方案，无审批手续”不影响脚手架的正常使用和施工，不属于违规行为。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_21_3", "title": "3.上述安全检查中发现的“个别立杆悬空问题”属于正常现象，在搭设脚手架时是不可避免的。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_21_4", "title": "4.依据《建设工程安全生产管理条例》规定，施工单位应当在施工组织设计中编制安全技术措施和施工现场临时用电方案，对达到一定规模的危险性较大的(   )等分部分项工程编制专项施工方案，并附具安全验算结果，经施工单位技术负责人、总监理工程师签字后实施。", "options": ["A.混凝土工程", "B.脚手架工程", "C.抹灰工程", "D.钢筋绑扎工程"], "correctIndex": 1}]},
            {"id": "gl_al_22", "title": "22. [案例背景] 某公司在一工地用吊篮进行外装修作业时，施工员指派一名抹灰工升吊篮，由于吊篮未挂保险钢丝绳，在上升时突然一个倒链急剧下滑，吊篮随即倾斜，由于一作业人员未系安全带，从吊篮坠落死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_22_1", "title": "1.造成这一事故的主要原因之一是作业时吊篮未挂保险钢丝绳和工人未系安全带（   ）。", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_22_2", "title": "2.高处作业吊篮必须设置保险锁。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_22_3", "title": "3.作业时工人将安全带挂在吊篮升降用的钢丝绳上。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_22_4", "title": "4.下列关于施工员布置这项工作的说法正确的是(   )", "options": ["A.事故责任在于设备，与施工员无关", "B.可以安排未经培训的抹灰工操作吊篮的升降", "C.施工现场的工作布置由施工员安排，没有违章指挥", "D.抹灰工对于施工员的违章指挥可以拒绝接受"], "correctIndex": 3}]},
            {"id": "gl_al_23", "title": "23. [案例背景] 某单位将新招来的一批民工直接派到工地参加人工挖孔桩施工。其中一人挖土深度达到5m时，闻到异样气味，感觉头晕腿软，奋力呼叫地面同伴，由于没有系安全绳，地上的人费尽周折才把下面的人救上来，险些酿成伤亡事故。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_23_1", "title": "1.此事件的违规之处在于，孔下作业人员未系安全绳。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_23_2", "title": "2.由于没有造成伤亡事故，所以可以认为没有违规。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_23_3", "title": "3.上述事件中，如果没有劳动合同，则即使发生了事故，也不属于施工单位的事故，可不予以上报。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_23_4", "title": "4.下列关于新工人上岗培训的要求正确的是(   )。", "options": ["A.新工人必须进行公司、班组和作业技术的三级安全教育", "B.新工人上岗前必须接受规定课时的安全生产教育培训", "C.对于不从事危险作业的新工人不必进行安全教育和技术培训", "D.从事特种作业的新工人可以直接进行特种作业人员培训，不需要再进行三级安全教育"], "correctIndex": 1}]},
            {"id": "gl_al_24", "title": "24. [案例背景] 某工地按施工进度要求正在搭设扣件式脚手架，安全员巡视检查发现新购进的扣件表面粗糙，商标模糊，向架子工询问，工人说有的扣件螺栓滑丝，有的扣件一拧，小盖口就裂了。安全员对此批扣件质量发生怀疑。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_24_1", "title": "1.对于上述情况，安全员不必作相应处理。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_24_2", "title": "2.国家对扣件式钢管脚手架使用的扣件实行生产许可证制度。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_24_3", "title": "3.为防止安全事故的发生，安全员处理此事，下列方法正确的是（  ）。", "options": ["A.扣件检验不合格，将所有扣件清除出现场，追回已使用的扣件，并向有关负责人报告追查不合格产品的来源", "B.告诉工人将坏掉的扣件保留，以便万一发生事故时留作证据", "C.把有问题扣件扔掉，好的继续使用", "D.保存此批扣件，用于上部脚手架的搭设"], "correctIndex": 0}, {"subId": "gl_al_24_4", "title": "4.下列关于脚手架工程的规定正确的是(   )。", "options": ["A.常规的脚手架工程，可以不编制专项施工方案，做好验收即可", "B.对脚手架工程所使用的钢管、扣件应检查验收其质量，脚手板、安全网可以不必验收", "C.脚手架工程必须编制专项施工方案，并严格按照经审批的方案搭设", "D.从事特种作业的架子工因持有特种作业操作证，不必进行入场安全教育"], "correctIndex": 2}]},
            {"id": "gl_al_25", "title": "25. [案例背景] 某小区十号楼地下室有一电气设备，该设备一次电源线使用二芯绕线，缆线长度为10.5m；接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；安装在该设备上的漏电开关内的拉杆脱落，漏电开关失灵。某工程公司在该地下室施工中，付某等3名抹灰工将该电气设备移至新操作点，移动过程中付某触电死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_25_1", "title": "1.本事故的原因主要是违章操作，移动电器设备未切断电源；操作人员不是专业电工，不能移动电气设备；缺乏日常安全检查，未及时发现事故隐患；可能造成付某触电的漏电原因有电气设备漏电，接头处没有用橡皮包布包扎，绝缘处磨损，电源线裸露；漏电开关失灵等。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_25_2", "title": "2.特种作业人员必须按照国家有关规定经过专门的安全作业培训，并取得特种作业操作资格证书后，方可上岗作业。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_25_3", "title": "3.下列属于特种作业人员的是(   )。", "options": ["A.电工", "B.木工", "C.水暖工", "D.瓦工"], "correctIndex": 0}, {"subId": "gl_al_25_4", "title": "4.下列关于特种作业的说法正确的是(   )。", "options": ["A.正确于特种作业人员未经培训考核即从事特种作业并造成重大安全事故，构成犯罪的，对直接责任人员.班组长、特种作业培训人员、项目管理人员和企业主要负责人等全部相关管理人员，依照刑法的有关规定追究刑事责任", "B.对特种作业人员专门的安全作业培训，是指由有关主管部门组织的专门针对特种作业人员的培训，也就是特种作业人员在独立上岗作业前，必须进行与本项目相适应的、各工种相互交叉作业时安全技术理论学习和实际操作训练", "C.根据《特种作业人员安全技术培训考核管理办法》规定，特种作业是指容易发生人员伤亡事故，对操作者本人、他人及周围设施的安全有重大危害的作业", "D.特种作业人员必须是身体健康、无妨碍从事相应工种作业的疾病和生理缺陷，而且具有相应的特种作业培训合格证书和中级以上职称的人员"], "correctIndex": 2}]},
            {"id": "gl_al_26", "title": "26. [案例背景] 某工程公司在一大厦广场基础工程进行护坡桩锚杆作业。当天工地主要负责人、安全员、电工等有关领导及管理人员都去别的地方而不在现场。工地施工分成一、二两组，班组长秦某请假，临时委托张某代替自己的工作，张某在二组指挥下锚杆筋笼，一组无人指挥，长22m，由3根Φ25螺纹钢的钢筋笼由13名民工自行进行作业，民工在下锚杆时，因钢筋笼将配电箱引出的380V电缆线磨破，使钢筋笼带电，造成5个触电，经医院抢救，其中3人脱险，另两人因光脚未穿鞋，经抢救无效死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_26_1", "title": "1.这起事故中造成触电伤害原因之一是民工违章作业。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_26_2", "title": "2.这起事故中，操作人员没有违规操作的行为。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_26_3", "title": "3.这起事故直接原因的是(   )。", "options": ["A.由13名民工进行作业，人员过多", "B.工地主要负责人不在现场", "C.班组长秦某请假", "D.380V电缆线磨破漏电"], "correctIndex": 3}, {"subId": "gl_al_26_4", "title": "4.下列对于三类人员的安全管理职责的说法正确的是(   )。", "options": ["A.施工单位主要负责人依法对本单位参与施工的所有项目的安全生产工作负主要责任", "B.施工单位的项目负责人对本单位参与施工的建设工程项目的安全负全部责任", "C.现场安全生产管理人员负责对安全生产进行现场监督检查", "D.专职安全生产管理人员对违章指挥、违章操作的，应当立即报告，并可以越级上报，但无权制止施工单位的行为"], "correctIndex": 2}]},
            {"id": "gl_al_27", "title": "27. [案例背景] 某公司在一工地用吊篮架进行外装修作业时，首层安全网已经拆除，施工员指派一名抹灰工升降吊篮，在用倒链升降时，未挂保险钢丝绳，突然一个倒链急剧下滑，吊篮随即倾斜，使一名工人从吊篮上摔下死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_27_1", "title": "1.“违章操作，作业时未挂安全绳，工人未系安全带”属于造成这一事故发生的不安全因素之—。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_27_2", "title": "2.上述事故中，“用吊篮架进行外装修作业时，首层安全网拆除”的做法是错误的，属于违章作业。（  ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_27_3", "title": "3.下列关于本事故的说法错误的是(   )。", "options": ["A.施工员违章指挥，不应指派抹灰工进行操作", "B.项目负责人没有亲自指挥", "C.作业时没有对升降装置进行认真检查，设备带“病”作业", "D.违反高处作业规定，支设的水平安全网在高处作业未完成时被拆除"], "correctIndex": 1}, {"subId": "gl_al_27_4", "title": "4.下列关于施工员布置这项工作的说法正确的是(   )。", "options": ["A.事故责任在于设备，与施工员无关", "B.对于临时安排抹灰工操作一下升降吊篮没有什么，是施工员统筹考虑现场实际的正确工作布置", "C.施工现场的工作布置由施工员安排，没有违章指挥", "D.抹灰工对于施工员布置的明显有较大危险而且没有防护设施的工作可以不接受"], "correctIndex": 3}]},
            {"id": "gl_al_28", "title": "28. [案例背景] 某施工队在某单位租借一间平房，承揽装修工程，由原来仅加工的木工活，要再增加做铝合金和塑钢门窗加工，没有正式电工。房间里要重新布置一下，原有一单相小电气设备(多功能木工机械)要移位，该设备的一次电源线是使用软电缆线沿墙边明设在水泥地面上的。缆线绝缘层已有磨损，电缆线裸露，接头处也没有用绝缘胶布包好，安装在该设备上的漏电开关也已失灵。在移动过程中田某等两名触电死亡，学徒工看见后又用手直接去拉田某也被电死。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_28_1", "title": "1.田某等人触电死亡的主要原因有：违章操作，移动电气设备必须经电工切断电源，并做妥善处理后进行；破损电缆线未及时更换，不符合安全用电要求；非专业电工移动了电气设备；漏电开关失灵，不起安全保护作用；缺乏日常安全教育和检查，未及时发现事故隐患等。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_28_2", "title": "2.上述事故中，只有最后的学徒工的做法是错误的，其前两名人员的死亡属于意外，很难控制。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_28_3", "title": "3.下列关于电工的说法正确的是(   )", "options": ["A.电工不属于特种作业人员范围", "B.电工不需要特别的培训，只要懂得电工作原理的人就可以在施工现场操作用电", "C.电工需要按照特种作业人员的培训和考核要求进行培训和考核合格后才可上岗", "D.对于投资100万元以下的的建设项目，可以不需要电工"], "correctIndex": 2}, {"subId": "gl_al_28_4", "title": "4.对于本案例中造成3人死亡的事故，下列说法正确的是(   )。", "options": ["A.本案例事故发生在自己公司工作场地修缮作业过程中，不属于对外承揽项目施工过程中发生的事故，不应按照事故报告程序上报，自行处理即可", "B.本案例事故发生在自己公司工作场地修缮作业过程中，不属于工伤保险范围之内", "C.本案例事故属于较大事故，应立即上报", "D.本案例的事故由于是在租赁的房间内由于电缆线布置不当及裸露的原因而引发的事故，事故责任在于房屋出租方"], "correctIndex": 2}]},
            {"id": "gl_al_29", "title": "29. [案例背景] 某建筑公司，为了安排下岗职工就业，在集镇路边30m2房间内，开了一个电气焊修理门市部。为了节约资金，焊机用的是已停用一年的旧机，一次测电源用的是闸刀开关，并安装在室内，门口路边就是焊接与切割场所。室内既是焊切工具、氧气瓶、乙炔瓶的储存间，又是工人中午吃饭休息的场所。公司对工人只进行了短期培训，便开业。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_29_1", "title": "1.该电气焊修理门市部的安全隐患有：工人生活及其所用设备、工具均在同一狭小的室内；在30㎡有闸刀开关的室内，不应存放氧气瓶及乙炔瓶；作业人员无证上岗；焊机各项性能指标未经检验；氧气瓶与乙炔瓶不能混放等。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_29_2", "title": "2.上述施工企业的是为了安排下岗职工就业的行为，公司对职工的培训可以不和其他职工的培训一样，不受限制。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_29_3", "title": "3.下列关于焊机的说法正确的是(   )。", "options": ["A.焊机属于小型工具，使用时没有危险", "B.焊机属于电气设备，停用一段时间后可以继续使用，不需要重新进行检测", "C.焊机操作人员没有特殊要求", "D.焊机操作人员需要持证上岗"], "correctIndex": 3}, {"subId": "gl_al_29_4", "title": "4.下列关于焊机的说法正确的是(   )。", "options": ["A.焊工不属于特种作业人员", "B.该案例中对焊工的培训是合格的", "C.焊工的上岗条件没有特殊要求", "D.焊工应该按照《特种作业人员安全技术培训考核管理办法》的要求进行培训"], "correctIndex": 3}]},
            {"id": "gl_al_30", "title": "30. [案例背景] 2004年某业主将一栋大型剧院建筑的拆除任务，发包给李某拆除资质的防腐保温劳务公司，由于不了解拆除作业的危险性，操作人员决定先拆混凝土梁，后拆混凝土板。操作时，现场也无安全人员在场，无安全措施；在梁拆至一半时全部楼板塌下，造成多人死亡。事后检查该施工方法无方案、无交底，公司也没有施工方案管理制度。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_30_1", "title": "1.此事故发生的原因之一是：拆除作业发包给无相应资质的施工单位施工。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_30_2", "title": "2.先拆梁后拆板是事故发生的原因之一。(   )。", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_30_3", "title": "3.拆除作业的施工方案应先交安全员，由安全员批准后，方可施工。(   )", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_30_4", "title": "4.大型拆除作业必须编制施工方案，必要情况下应当组织专家进行论证。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_31", "title": "31. [案例背景] 某医院工程北配楼正在进行装修施工，电焊工张某在地上一层焊接水暖支架时，焊渣跌落至地下一层，引燃了堆放在地下一层的聚苯乙烯保温材料，从而引发大火。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_31_1", "title": "1.我国消防工作的方针是（  ）。", "options": ["A.以防为主，防治结合", "B.以防为主，防消结合", "C.安全第一，预防为主", "D.预防为主，综合治理"], "correctIndex": 1}, {"subId": "gl_al_31_2", "title": "2.施工现场内贮存易燃易爆危险品的仓库、库区，属于（  ）动火区域。", "options": ["A.一级", "B.二级", "C.三级", "D.四级"], "correctIndex": 0}, {"subId": "gl_al_31_3", "title": "3.在施工现场禁火区域内动火，作业前必须申请办理动火证，动火证不需要注明（  ）。", "options": ["A.动火地点", "B.动火时间", "C.动火人", "D.动火成本"], "correctIndex": 3}, {"subId": "gl_al_31_4", "title": "4.电焊工张某违规操作是引起本起事故的主要原因。（  ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_32", "title": "32. [案例背景] 2011年5月某造价5600万的市政工地钢筋工周某用交电机接钢筋，在梳理电焊线过程中触碰焊把钳发生触电，经工友送医院救治无效死亡。事后调查发现该项目无持证电工，电焊机是周某自行从圆盘锯的专用开关箱接线，事故发生时项目部管理人员均不在场，项目部配备了2名专职安全员但投标文件不一致且未办理变更手续，其中一名为大三学生实习。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_32_1", "title": "1.按照该项目类别及规模应至少配备（  ）名专职安全员。", "options": ["A.1", "B.2", "C.3", "D.4"], "correctIndex": 1}, {"subId": "gl_al_32_2", "title": "2.该事故发生的直接原因为（  ）。", "options": ["A.现场无专职电工", "B.发生事故时项目部管理人员不在岗", "C.项目专职安全员配备不足", "D.周某触碰焊把钳且电焊机未接专用开关箱"], "correctIndex": 3}, {"subId": "gl_al_32_3", "title": "3.下面不属于违章作业的有（  ）。", "options": ["A.周某用交流电焊机焊接钢筋", "B.周某从开关箱接电焊机", "C.项目部接受大三学生现场实习", "D.项目专职安全员未办理变更手续"], "correctIndex": 2}, {"subId": "gl_al_32_4", "title": "4.该事故中若电焊机采用电焊机专用开关箱可避免本次事故发生。（  ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_33", "title": "33. [案例背景] 2006年1月16日，某下水道工程施工现场发生一起沟槽坍塌事故，造成4人死亡、3人受伤，直接经济损失96.46万元。事发当日，该施工人员正在进行下水道沟槽挖土施工时(沟底深度4～4.5m)，沟壁突然坍塌，1人被埋。正在附近作业的13名马上围到事发地点扒土抢救被埋者。数分钟后沟壁发生二次坍塌，将参与抢救的6人掩埋。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_33_1", "title": "1.按照事故严重程度属于（  ）", "options": ["A.一般事故", "B.较大事故", "C.重大事故", "D.特别重大事故"], "correctIndex": 1}, {"subId": "gl_al_33_2", "title": "2.生产经营单位的主要负责人未履行本法规定的安全生产管理职责，导致生产安全事故的，由安全生产监督管理部门依照下列规定处以罚款:发生重大事故的，处上一年年收入（  ）的罚款。", "options": ["A.0.6", "B.0.7", "C.0.8", "D.0.9"], "correctIndex": 2}, {"subId": "gl_al_33_3", "title": "3.安全色是传递安全信息含义的颜色，不包括（  ）颜色", "options": ["A.红", "B.蓝", "C.黄", "D.白"], "correctIndex": 3}, {"subId": "gl_al_33_4", "title": "4.三级安全教育是每个刚进企业的新工人必须接受的首次安全生产方面的基本教育，三安全教育是指公司 (即企业)、项目 (或工程处、施工处、工区)、班组这三级。（  ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}]},
            {"id": "gl_al_34", "title": "34. [案例背景] 背景资料:2008年12月27日7时30分许，位于XX路的“上海城”工程施工电梯(荷载9人)在运送施工人员时发生坠落，造成18人死亡、1人重伤。2008年12月26日16时许，高某对施工电梯进行加节安装，同日21时许完成。经安全监察部门鉴定，电梯标准节的螺栓没有按要求安装是导致本次事故的直接原因，而未按要求安装附着及增加附着后未按规定验收合格就投入使用是导致本次事故的次要原因。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_34_1", "title": "1.安装人员无执业资格证书，是本次事故发生的直接原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_34_2", "title": "2.项目部也未安排安全员进行现场安全管理，表明管理松懈。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_34_3", "title": "3.监理人汤某未履行旁站监督职责，未对该栋楼的施工电梯及其使用、运行进行检查，应承担相应的法律责任是（   ）。", "options": ["A.民事责任", "B.刑事责任", "C.行政责任", "D.经济责任"], "correctIndex": 2}, {"subId": "gl_al_34_4", "title": "4.升降机上乘坐的工人远远超载是事故发生的（   ）", "options": ["A.直接原因", "B.间接原因", "C.次要原因", "D.重要原因"], "correctIndex": 0}]},
            {"id": "gl_al_35", "title": "35. [案例背景] 背景资料:某公路桥梁工程，总包方A公司将钢梁安装工程分包给 B安装公司。总包方A公司制了钢梁吊装方案并得到监理工程师的批准。由于工期紧，人员紧缺，B公司将刚从市场招聘的李某与高某经简单内部培训组成吊装组。根据施工进度计划安排，XX年X月XX日应进行吊装，但该日清晨雾很浓，能见度较低，吊装组就位，准备对组装完成的钢梁实施吊装作业。总包现场监管人员得知此事，通过手机极力劝阻。为了赶工，分包方无视劝阻，对吊装组仅作简单交底后，由李某将钢丝绳套于边棱锋利的钢梁上。钢丝绳固定完毕，李某随即指挥吊车司机高某，将钢梁吊离地面实施了第一吊。钢梁在 18m高处因突然断绳而坠落，击中正在下方行走的两位工人，致使两位工人当场死亡。事后查明钢丝绳存在断丝超标和严重渗油现象。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_35_1", "title": "1.依据《生产安全事故报告和调查处理条例》关于生产安全事故等级的划分，本次事故属于一般事故（   ）。", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_35_2", "title": "2.依据《建筑施工起重吊装安全技术规范》，恶劣天气后吊装作业应及时清理冰雪并应采取防漏电措施。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_35_3", "title": "3.分析事故发生经过，不属于本次事故的原因主要的是（   ）。", "options": ["A.初次第一吊，对钢梁未作试吊；在有大雾、光线不清的情况下，进行吊装作业", "B.总包方A公司将钢梁安装工程分包给B安装公司", "C.高某违章作业；李某违章作业，违章指挥", "D.两位工人在吊装区行走"], "correctIndex": 1}, {"subId": "gl_al_35_4", "title": "4.针对钢丝绳存在断丝超标和严重渗油现象这一隐患，项目部应及时检查维修和保养，截断钢丝绳破损部分，进行接长处理。判断这一分析是否正确?（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "gl_al_36", "title": "36. [案例背景] 背景资料:XX年5月10日，某公路工程处第三项目部在某立交桥施工期间，对立交桥作业区域内原有厂房拆除工程施工中，发生了一起因被拆除的建筑物坍塌导致2人死亡的事故。某建设单位委托第三项目部进行2000㎡厂房拆除工程的施工，厂房是砖混结构的两层楼房，要求 6月底前拆完，合同工期4个月，条件是第三项目部向建设单位上交3万元，拆除下来的钢筋由第三项目经理部支配。项目部又将此项工程分包给了M民工队，条件是以拆除下来的钢筋作为支付M的拆除施工的工程款，并于2月20日签订了合同书。拆除工程施工前，建设单位未向建设行政主管部门申报，也未给项目部提供厂房图纸等技术资料项目部要求民工队3月1日开工，民工队为了能以最小的投入获取最大的收益(旧钢筋)，未支搭拆除工程施工脚手架，而是站在被拆除厂房的楼板上，用铁锤进行作业。5月10日，厂房只剩最后一间约16㎡的休息室时，民工L、H和C站在休息室天花板(即二楼地板，二楼已被拆除)上，继续用铁锤锤击天花板。同日下午16:45左右，房屋中心部位的天花板水泥已基本脱落，民工L、H和C仍用铁锤捶击暴露出来的钢筋，致使天花板呈V字形折弯，继而拉倒两侧墙壁，C及时跳下逃生，L和H被迅速缩口的天花板V字折弯包夹。L在送往医院途中死亡，H在经医院抢救1小时后死亡。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_36_1", "title": "1.作业人员站在被拆除建筑物上进行拆除作业，违反了拆除工程施工操作规程，是导致此次事故发生的直接原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_36_2", "title": "2.建设单位在拆除工程施工前，应向建设行政主管部门报送材料和备案。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_36_3", "title": "3.原有厂房拆除工程施工时，拆除现场应设置围挡、警示标志，并应采用（   ）。", "options": ["A.装载机推倒厂房", "B.推机推倒施工", "C.吊车配合施工", "D.支搭脚手架施工"], "correctIndex": 3}, {"subId": "gl_al_36_4", "title": "4.该厂房拆除工程施工的正确方法是（   ）。", "options": ["A.从左至右、逐层、分段实施", "B.从左至右、立体交叉作业", "C.从上至下、逐层、分段实施", "D.从上至下、立体交叉作业"], "correctIndex": 1}]},
            {"id": "gl_al_37", "title": "37. [案例背景] 背景资料:某施工队在城市一条街道旁的一个旅馆工地拆除钢管脚手架。钢管紧靠建筑物，临街面架设有10kV的高压线，离建筑物只有2m，由于街道狭窄，暂无法解决距离过近的问题。而由于某些原因又不能切断对高压线的供电。由于上午下过雨，下午墙上仍比较湿。虽然上午安全员向施工工人讲过操作方式，要求立杆不要往上拉，应该向下放，但下午上班后在工地二楼屋面“女儿墙”内继续工作的泥工马X和普工刘X仍在屋顶上往上拉已拆除的一根钢管脚手架立杆。向上拉开一段距离后，马X、刘X以墙楼为支点，将管子压成斜向，欲将管子斜拉后置于屋顶上。由于斜度过大，钢管临街一端触及高压线，当时墙上比较湿，钢管与墙棱交点处发出火花，马X的胸口靠近管子烧弯处，身上穿着化纤衣服，当即燃烧起来，身体被烧伤。刘X手触管子，手指也被烧伤。楼下工友及时跑上楼将火扑灭，将受伤者送至医院。马X烧伤面积达50%，由于呼吸循环衰竭，抢救无效，于2月20日晚12时死于医院。刘X烧伤面积达15%，三根手指残疾。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_37_1", "title": "1.本案中，物的不安全状态是设计不良，即高压线距建筑物过近。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_37_2", "title": "2.本案中，“不按规定的方法操作，把立杆往斜上方拉”属于人的不安全行为。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_37_3", "title": "3.本案中，“钢管距高压线过近而未采取隔离措施”属于存在的安全管理的缺陷。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_37_4", "title": "4.本案中，“工人不具备安全生产的知识和能力”属于人的不安全行为。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}]},
            {"id": "gl_al_38", "title": "38. [案例背景] 背景资料:XX年12月22日，由X公司承建的X隧道发生瓦斯爆炸，造成44人死亡，11人受伤，大量施工设备损坏，直接经济损失2035 万元。该隧道为平行双洞隧道，左线全长4090m,右线全长4060m，由X公司施工隧道进口端左线2550m，右线2515m。隧道造价1.5亿元XX年10月12日，右洞开挖至K14+872处时，施工单位发现K14+790～K14+872段初期支护变形超限当即停止开挖。从10月17日开始，施工单位按照建设、设计、监理，施工四方会勘纪要对变形地段初期支护进行拆换。12月16日，初期支护钢拱架拆换至K14+860 时，随着围岩的剥落，K14+860～K14+865段逐渐形成大空腔(塌腔高度约0～4m)。12月19日下午，初期支护钢拱架拆换至K14+865处，原有初期支护背后围岩左前上方形成一漏斗状空腔，四方有关人员再次对现场进行会勘。12月20日至21日施工单位按照四方共同研究的处理方案对塌腔内进行了喷射混凝土支护，但塌方没有得到控制，空腔继续扩大，至22日零点班，塌腔已与掌子面连通，形成4～5m 高，6～7m 宽，约5m长的空腔，空腔内时有掉块现象。12月22日，白班先后有43人进入右洞，其中有9人于14时30分前先后出洞，右洞洞内剩余人员34人。当班因接风筒10时起停风1小时,11时接好风筒,恢复供风,当时风筒出风口距掌子面约30m,送风距离超1400m。模板台车配电箱附近悬挂的三芯插头短路，14时40分，发生瓦斯爆炸，爆炸冲击波将停放在距右洞处约20m远，重达70t的模板台车冲出40多米，洞口通风机错位，配电柜损坏，大幅宣传牌被掀飞，在洞外组装模板台车人员、门岗等有10人死亡、11人负伤。后调查发现分包的作业队无资质，农民工的安全知识和技能培训不到位，有部分瓦斯检查员无证上岗。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_38_1", "title": "1.根据《生产安全事故报告和调查处理条例》的规定，此次事故属于重大事故。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_38_2", "title": "2.风筒出风口距掌子面约30m，送风距离超1400m的做法是错误的。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_38_3", "title": "3.以下属于事故直接原因的是（   ）。", "options": ["A.该地段有煤层、储气构造、瓦斯通道(断层带)，塌方处导致瓦斯大量涌出", "B.违规将劳务分包给无资质的作业队", "C.模板台车配电箱附近悬挂的三芯插头短路产生火花引起瓦斯爆炸", "D.农民工的安全知识和技能培训不到位，有部分瓦斯检查员无证上岗"], "correctIndex": 2}, {"subId": "gl_al_38_4", "title": "4.以下属于事故间接原因的是（   ）", "options": ["A.掌子面塌方，瓦斯异常涌出", "B.模板台车附近瓦斯浓度达到爆炸极限", "C.模板台车配电箱附近悬挂的三芯插头短路产生火花引起瓦斯爆炸", "D.违规将劳务分包给无资质的作业队"], "correctIndex": 3}]},
            {"id": "gl_al_39", "title": "39. [案例背景] 背景资料:2009年5月17日，X市红旗路高架桥发生垮塌事故，造成9人死亡，16人受伤，24辆车受损。事故发生时，在对高架桥110号-109号桥墩段路面实施机械拆除，桥墩突然断裂，形成骨牌效应，导致八个桥墩九个桥面坍塌。事故死者善后处理按照“一个领导、一套班子、一个标准”的善后处理方案，对于每一名事故死者，统筹安排一名市级领导对接善后处理。死者不论城乡、不论年龄，死亡赔偿标准统一定为每人40万元，由施工单位委托业主单位先期代为垫付赔偿。经查实，犯罪嫌疑人程某经XX民爆工程有限公司总经理高某同意，在不具备相应资质的情况下，以挂靠XX民爆工程有限公司的方式通过招投标程序中得红旗高架桥爆破拆除工程项目。整个高架桥的拆除由XX监理公司负责全程监理，在施工监理过程中，没有对程某等人有无机械拆除高架桥资质和相关安全措施予以审查。经检察机关审查，依法批准对涉嫌犯罪的程某、高某等9人予以逮捕。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_39_1", "title": "1.2009年事故死亡赔偿每人40万元符合当地的赔偿标准。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_39_2", "title": "2.从2015年开始，工伤事故死亡赔偿标准大大提高。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 1}, {"subId": "gl_al_39_3", "title": "3.此起安全事故的等级属于（   ）", "options": ["A.一般事故", "B.较大事故", "C.重大事故", "D.特别重大事故"], "correctIndex": 1}, {"subId": "gl_al_39_4", "title": "4.此起安全事故责任人员若构成犯罪，其罪名是（   ）", "options": ["A.工程重大安全事故罪", "B.重大责任事故罪", "C.渎职罪", "D.重大劳动安全事故罪"], "correctIndex": 1}]},
            {"id": "gl_al_40", "title": "40. [案例背景] 背景资料:2015年4月开始，公路项目部工地的从业人员有时多达三四十人，施工地点距场区出口有五六公里路程，而施工单位仅有一辆面包车负责接送，明显坐不下所有从业人员，从业人员大部分带有施工工具，面包车也不便装载。所以，工地的包工头在从业人员多的时候，便安排在施工工地拖土的外雇自卸货车负责接送从入口到作业点的从业人员。建设、施工、监理等单位发现了这一情况，下发了相关文件，做出了禁止违规车辆在工区范围内行驶并载人的要求，但没有采取进一步的措施来解决这一客观存在的现象。2015年5月12日上午，为公司做事的从业人员多达四十余人。11 时，外雇驾驶员任某驾驶无牌改装蓝色东风牌自卸货车在工地内拖完土后准备收工，按照惯例，他要将在工地做事的部分从业人员搭载下来送至下出口。在上出口装载了5名从业人员后(其中2人坐驾驶室、3人坐货箱)往下接送，当行至场内工地旁时，在该地做工的16名从业人员也按惯例上了该车的货厢。调查询问中，施工单位的现场负责人、安全监察员等说予以了口头制止，但没有采取其他有效措施来阻止车辆的继续行进。11时10分，该车行至下入口下坡处，由于制动失效，加上处置不当，造成货车翻车，致使5人当场死亡，3人经医院抢救无效后当日死亡，13人受伤。事故发生后，驾驶员任某在当地水库溺水自杀。", "image": "", "isCase": true, "subQuestions": [{"subId": "gl_al_40_1", "title": "1.驾驶员驾驶的无牌机动车制动不合格，致使车辆在行进过程不能有效地进行制动；且在车辆制动失效后，未能采取正确、妥善的操作，致使车辆侧翻，是导致事故发生的直接原因。（   ）", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_40_2", "title": "2.建设、施工、监理等单位的安全管理制度落实不到位是导致事故发生的间接原因", "options": ["A.正确", "B.错误"], "correctIndex": 0}, {"subId": "gl_al_40_3", "title": "3.无牌机动车驾驶员任某对本次事故负直接责任，对其（   ）。", "options": ["A.追究行政责任", "B.因自杀不再追究责任", "C.追究民事责任", "D.追究刑事责任"], "correctIndex": 1}, {"subId": "gl_al_40_4", "title": "4.当年全国城镇居民人均可支配收入为 28844 元，根据《国务院关于进一步加强企业安全生产工作的通知》本次事故每位因公死亡员工应该发放的工亡补助金和丧葬补助金两项费用合计大约为（   ）元", "options": ["A.60万", "B.30万", "C.50万", "D.80万"], "correctIndex": 0}]}] 
    };

    let currentCategory = "法规单选"; 
    let isWrongMode = false;        
    let currentPool = [];           
    let currentIndex = 0;           

    let wrongBook = JSON.parse(localStorage.getItem('my_wrong_book_v6')) || [];
    let savedProgress = JSON.parse(localStorage.getItem('my_progress_v6')) || {};

    window.onload = function() {
        // 初始加载第一个板块
        switchCategory("法规单选");
    };

    function switchCategory(category) {
        currentCategory = category;
        isWrongMode = false;
        
        let buttons = document.getElementById("category-tabs").getElementsByTagName("button");
        for(let btn of buttons) btn.classList.remove("active");
        
        // 防呆设计：如果按钮存在才加active
        let currentBtn = document.getElementById("tab-" + category);
        if (currentBtn) currentBtn.classList.add("active");
        
        document.getElementById('review-btn').classList.remove('active');
        document.getElementById('mode-badge').innerText = "📚 " + category + " 顺序刷题模式";
        document.getElementById('mode-badge').className = "status-badge";

        currentPool = questionBank[currentCategory] || [];
        currentIndex = savedProgress[currentCategory] || 0;
        if (currentIndex >= currentPool.length) currentIndex = 0;

        prepareRender();
    }

    function toggleWrongMode() {
        let reviewBtn = document.getElementById('review-btn');
        if (isWrongMode) {
            switchCategory(currentCategory);
        } else {
            let wrongsInCat = (questionBank[currentCategory] || []).filter(q => wrongBook.includes(q.id));
            if (wrongsInCat.length === 0) {
                alert("太棒了！当前【" + currentCategory + "】板块下没有错题哦！");
                return;
            }
            isWrongMode = true;
            currentPool = wrongsInCat;
            currentIndex = 0; 

            reviewBtn.classList.add('active');
            document.getElementById('mode-badge').innerText = "🔥 错题复习模式";
            document.getElementById('mode-badge').className = "status-badge wrong-mode";
            
            prepareRender();
        }
    }

    function prepareRender() {
        if(currentPool.length === 0) {
            document.getElementById("q-title").innerText = "该板块暂无题目数据。";
            document.getElementById("q-content").innerHTML = "";
            document.getElementById("q-img").style.display = "none";
            document.getElementById("question-dropdown").innerHTML = "<option>无</option>";
            return;
        }

        const dropdown = document.getElementById("question-dropdown");
        dropdown.innerHTML = "";
        for(let i = 0; i < currentPool.length; i++) {
            let opt = document.createElement("option");
            opt.value = i;
            opt.innerText = "第 " + (i + 1) + " 题";
            dropdown.appendChild(opt);
        }
        
        renderQuestion();
    }

    function renderQuestion() {
        if(currentPool.length === 0) return;
        
        const q = currentPool[currentIndex];
        document.getElementById("question-dropdown").value = currentIndex;
        
        let titleEl = document.getElementById("q-title");
        let contentEl = document.getElementById("q-content");
        
        if (q.isCase) {
            titleEl.className = "case-bg";
            titleEl.innerText = q.title;
            contentEl.innerHTML = "";
            
            // 防呆设计：如果没提取到subQuestions，给个友好提示
            if (!q.subQuestions || q.subQuestions.length === 0) {
                 contentEl.innerHTML = "<div style='color:red;'>⚠️ 此案例题下无小题数据，请检查提取格式。</div>";
            } else {
                q.subQuestions.forEach((subQ) => {
                    let subTitle = document.createElement("div");
                    subTitle.className = "sub-question-title";
                    subTitle.innerText = subQ.title;
                    contentEl.appendChild(subTitle);

                    let optBox = document.createElement("div");
                    optBox.className = "options-container";
                    subQ.options.forEach((optText, index) => {
                        let btn = document.createElement("button");
                        btn.className = "option-btn";
                        btn.innerText = optText;
                        btn.onclick = () => checkAnswer(index, subQ.correctIndex, optBox, q.id); 
                        optBox.appendChild(btn);
                    });
                    contentEl.appendChild(optBox);
                });
            }
        } else {
            titleEl.className = "question-title";
            titleEl.innerText = q.title;
            contentEl.innerHTML = "";
            let optBox = document.createElement("div");
            optBox.className = "options-container";
            q.options.forEach((optText, index) => {
                let btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = optText;
                btn.onclick = () => checkAnswer(index, q.correctIndex, optBox, q.id);
                optBox.appendChild(btn);
            });
            contentEl.appendChild(optBox);
        }

        const imgEl = document.getElementById("q-img");
        if (q.image && q.image.trim() !== "") {
            imgEl.src = q.image; 
            imgEl.style.display = "block";
        } else {
            imgEl.style.display = "none";
        }

        if (!isWrongMode) {
            savedProgress[currentCategory] = currentIndex;
            localStorage.setItem('my_progress_v6', JSON.stringify(savedProgress));
        }
    }

    function checkAnswer(selectedIndex, correctIndex, optionsBox, qId) {
        let allBtns = optionsBox.getElementsByTagName("button");
        let isCorrect = (selectedIndex === correctIndex);

        for(let i = 0; i < allBtns.length; i++) {
            allBtns[i].classList.add("disabled"); 
            if(i === correctIndex) allBtns[i].classList.add("correct");
            else if (i === selectedIndex && !isCorrect) allBtns[i].classList.add("wrong");
        }

        if (!isCorrect && !wrongBook.includes(qId)) {
            wrongBook.push(qId);
            localStorage.setItem('my_wrong_book_v6', JSON.stringify(wrongBook));
        } else if (isCorrect && isWrongMode) {
            wrongBook = wrongBook.filter(id => id !== qId);
            localStorage.setItem('my_wrong_book_v6', JSON.stringify(wrongBook));
        }
    }

    function addToWrongBook() {
        if(currentPool.length === 0) return;
        const qId = currentPool[currentIndex].id;
        if(!wrongBook.includes(qId)) {
            wrongBook.push(qId);
            localStorage.setItem('my_wrong_book_v6', JSON.stringify(wrongBook));
            alert("✅ 已强制加入错题本！");
        } else alert("已在错题本中！");
    }

    function jumpToQuestion() { currentIndex = parseInt(document.getElementById("question-dropdown").value); renderQuestion(); }
    function prevQuestion() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } else alert("已经是第一题啦！"); }
    function nextQuestion() { 
        if(currentIndex < currentPool.length - 1) { currentIndex++; renderQuestion(); } 
        else { isWrongMode ? (alert("错题复习完毕！"), toggleWrongMode()) : alert("恭喜刷完本板块！"); } 
    }
    function clearData() {
        if(confirm("确定清空【" + currentCategory + "】的进度和错题？")) {
            savedProgress[currentCategory] = 0; localStorage.setItem('my_progress_v6', JSON.stringify(savedProgress));
            let currentIds = questionBank[currentCategory].map(q => q.id);
            wrongBook = wrongBook.filter(id => !currentIds.includes(id));
            localStorage.setItem('my_wrong_book_v6', JSON.stringify(wrongBook));
            location.reload();
        }
    }
</script>
